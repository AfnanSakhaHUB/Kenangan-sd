<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akhir Perjalanan Kita 🚀</title>
    <style>
        /* --- RESET & SPACE THEME (100% Persis start.html) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020208;
            color: #fff;
        }

        /* --- BACKGROUND ANTARIKSA BERGERAK TURUN (100% Persis start.html) --- */
        .space-bg {
            position: absolute;
            width: 100%;
            height: 200%;
            top: 0; left: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, #fff 1px, transparent 2px),
                radial-gradient(circle at 75% 60%, #fff 1.5px, transparent 3px),
                radial-gradient(circle at 50% 10%, rgba(255,255,255,0.4) 2px, transparent 40px),
                radial-gradient(circle at 85% 85%, #fff 1px, transparent 2px);
            background-size: 300px 300px, 400px 400px;
            animation: spaceScroll 25s linear infinite;
            z-index: 1;
            transition: transform 2s cubic-bezier(0.45, 0, 0.55, 1);
        }

        @keyframes spaceScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .nebula {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(58, 143, 253, 0.15) 0%, transparent 70%);
            top: 20%; left: -10%;
            border-radius: 50%;
            z-index: 2;
            animation: floatNebula 10s ease-in-out infinite alternate;
            transition: transform 2s cubic-bezier(0.45, 0, 0.55, 1);
        }
        @keyframes floatNebula {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.2); }
        }

        /* --- CONTAINER UTAMA CINEMATIC (100% Persis start.html) --- */
        .cinema-container {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 2s cubic-bezier(0.45, 0, 0.55, 1);
        }

        /* --- INTERACTIVE PROMPT LAYER (100% Persis start.html) --- */
        #interaction-layer {
            position: absolute;
            width: 100%; height: 100%;
            background: rgba(2, 2, 8, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease;
        }
        .play-box {
            text-align: center;
            cursor: pointer;
            padding: 30px;
            border: 2px dashed #ffdd1a;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            animation: pulseBox 2s infinite alternate;
        }
        @keyframes pulseBox {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,221,26,0.2); }
            100% { transform: scale(1.03); box-shadow: 0 0 30px rgba(255,221,26,0.5); }
        }

        /* --- BINGKAI FOTO FILM & NARASI (100% Persis start.html) --- */
        .memory-card {
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .memory-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 350px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 4px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            background: #000;
        }

        #photoSlot {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1);
            filter: blur(0px);
            opacity: 1;
            transition: transform 6s linear, filter 0.4s ease, opacity 0.4s ease;
        }

        .narrative-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f1f5f9;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- TOMBOL LANJUT / KEMBALI (100% Persis gaya btnLanjut start.html) --- */
        #btnLanjut {
            display: none;
            margin-top: 25px;
            padding: 14px 40px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #020208;
            background: #ffdd1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 221, 26, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 80;
            opacity: 0;
            transform: translateY(10px);
            animation: bounceBtn 1s infinite alternate;
            text-decoration: none;
        }
        #btnLanjut.show {
            display: inline-block;
            opacity: 1;
            transform: translateY(0);
        }
        #btnLanjut:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 221, 26, 0.9);
            background: #fff;
        }
        @keyframes bounceBtn {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        /* --- LAPISAN LANGIT SEBAGAI EMBED PENUTUP --- */
        .sky-overlay {
            position: fixed;
            top: 100vh;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #0284c7, #38bdf8, #bae6fd, #f0f9ff);
            z-index: 99;
            transition: transform 2s cubic-bezier(0.45, 0, 0.55, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- TRIGGER RENDERING GERAKAN (100% Persis start.html) --- */
        body.pan-down-active .cinema-container { transform: translateY(-100vh); }
        body.pan-down-active .space-bg { transform: translateY(-50vh); }
        body.pan-down-active .nebula { transform: translateY(-50vh); }
        body.pan-down-active .sky-overlay { transform: translateY(-100vh); }

        /* --- DETIL TRIGGER ELEMEN ASAP & ROKET TRANSISI (100% Persis start.html) --- */
        .trans-rocket {
            position: absolute;
            z-index: 50;
            width: 50px;
            height: 100px;
            pointer-events: none;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .smoke-particle {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, rgba(241, 245, 249, 0.9) 0%, rgba(148, 163, 184, 0.5) 50%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 40;
            animation: smokePuff 0.9s forwards ease-out;
        }

        @keyframes smokePuff {
            0% { transform: scale(1) translate(0, 0); opacity: 0.8; filter: blur(2px); }
            40% { opacity: 1; filter: blur(6px); }
            100% { transform: scale(6) translate(-30px, 20px); opacity: 0; filter: blur(15px); }
        }

        /* --- DESAIN ROKET ENGINE (100% Persis start.html) --- */
        .rocket-body {
            width: 30px; height: 65px;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            border-radius: 50% 50% 4px 4px / 70% 70% 4px 4px;
            position: relative; margin: 0 auto;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .rocket-window {
            width: 10px; height: 10px;
            background: #38bdf8; border: 2px solid #94a3b8;
            border-radius: 50%; position: absolute;
            top: 18px; left: 8px;
        }
        .rocket-wing-left {
            width: 0; height: 0;
            border-right: 12px solid #ef4444;
            border-top: 25px solid transparent;
            position: absolute; bottom: 0; left: -12px;
        }
        .rocket-wing-right {
            width: 0; height: 0;
            border-left: 12px solid #ef4444;
            border-top: 25px solid transparent;
            position: absolute; bottom: 0; right: -12px;
        }
        .rocket-fire {
            width: 14px; height: 30px;
            background: linear-gradient(to bottom, #ffdd1a, #ef4444, transparent);
            margin: -2px auto 0; border-radius: 0 0 8px 8px;
            animation: fireBurn 0.08s infinite alternate;
        }

        @keyframes fireBurn {
            0% { height: 25px; opacity: 0.9; }
            100% { height: 35px; opacity: 1; filter: blur(1px); }
        }

        .progress-indicator {
            position: absolute;
            top: 20px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="interaction-layer">
        <div class="play-box" id="btnMulaiSkenario">
            <h2 style="color: #ffdd1a; margin-bottom: 10px;">🚀 Buka Lembar Kenangan Penutup 🌟</h2>
            <p style="font-size: 0.9rem; color: #94a3b8;">Ketuk layar untuk mengakhiri perjalanan sinematik</p>
        </div>
    </div>

    <div class="space-bg"></div>
    <div class="nebula"></div>

    <audio id="memoriesAudio" preload="auto">
        <source src="VID-20260610-WA0019.mp3" type="audio/mpeg">
    </audio>

    <div class="cinema-container">
        <div class="progress-indicator" id="progText">Menyiapkan Lembar Akhir...</div>

        <div class="memory-card" id="displayBox">
            <div class="image-wrapper" id="wrapperZone">
                <img src="" id="photoSlot" alt="Memories">
            </div>
            <div class="narrative-text" id="captionSlot">Membuka lembaran memori terakhir...</div>
        </div>

        <a href="index.html" id="btnLanjut">Selesai 🏠</a>
    </div>

    <div class="sky-overlay" id="skyOverlay">
        <h2 style="color: #fff; font-size: 2rem; text-shadow: 0 4px 10px rgba(0,0,0,0.15); font-weight: 800; letter-spacing: 1px;">Sampai Jumpa di Masa Depan... ✨</h2>

    <script>
        const btnMulaiSkenario = document.getElementById('btnMulaiSkenario');
        const interactionLayer = document.getElementById('interaction-layer');
        const memoriesAudio = document.getElementById('memoriesAudio');
        const displayBox = document.getElementById('displayBox');
        const wrapperZone = document.getElementById('wrapperZone');
        const photoSlot = document.getElementById('photoSlot');

        // ==========================================================================
        // DATA TIMELINE KRONOLOGIS: 43 FOTO ELEMEN PENUTUP (BERSIH DARI NAMA SISWA)
        // Berjalan bergantian otomatis mengikuti durasi detik lagu penutup.
        // ==========================================================================
        const memoryTimeline = [
            { time: 1, img: "IMG-20260609-WA0001.jpg", text: "Setiap kisah hebat selalu berawal dari sebuah langkah kecil penuh harapan.", phase: "Memori 1/43" },
            { time: 5, img: "IMG-20260609-WA0002.jpg", text: "Waktu demi waktu terlewati di bawah atap sekolah tempat kita berteduh.", phase: "Memori 2/43" },
            { time: 9, img: "IMG-20260609-WA0003.jpg", text: "Tawa yang tercipta di sela bangku kelas menjadi bumbu berharga.", phase: "Memori 3/43" },
            { time: 13, img: "IMG-20260609-WA0004.jpg", text: "Ada kalanya kita belajar serius, menatap masa depan yang masih misteri.", phase: "Memori 4/43" },
            { time: 17, img: "IMG-20260609-WA0005.jpg", text: "Berbagi cerita, bertukar pemikiran, perlahan membentuk diri kita.", phase: "Memori 5/43" },
            { time: 21, img: "IMG-20260609-WA0006.jpg", text: "Kebersamaan sederhana di sudut teras sekolah yang akan dirindukan.", phase: "Memori 6/43" },
            { time: 25, img: "IMG-20260609-WA0007.jpg", text: "Langkah kaki kita beriringan menapaki lorong waktu selama enam tahun.", phase: "Memori 7/43" },
            { time: 29, img: "IMG-20260609-WA0008.jpg", text: "Setiap candaan kecil spontan sukses mencairkan suasana yang kaku.", phase: "Memori 8/43" },
            { time: 33, img: "IMG-20260609-WA0009.jpg", text: "Menyimpan sejuta kenangan berharga dalam jepretan kamera sederhana.", phase: "Memori 9/43" },
            { time: 37, img: "IMG-20260609-WA0011.jpg", text: "Berdiri bersama, menyatukan tujuan tanpa membedakan satu sama lain.", phase: "Memori 10/43" },
            { time: 41, img: "IMG-20260609-WA0012.jpg", text: "Kompak dalam setiap kegiatan menjadi ciri khas angkatan kebanggaan.", phase: "Memori 11/43" },
            { time: 45, img: "IMG-20260609-WA0013.jpg", text: "Momen hangat saat merayakan hari besar bersama bapak dan ibu guru.", phase: "Memori 12/43" },
            { time: 49, img: "IMG-20260609-WA0016.jpg", text: "Wajah-wajah ceria yang selalu menghiasi ruang kelas setiap harinya.", phase: "Memori 13/43" },
            { time: 53, img: "IMG-20260609-WA0017.jpg", text: "Kerja kelompok penuh dinamika, kadang berdebat tapi berakhir tertawa.", phase: "Memori 14/43" },
            { time: 57, img: "IMG-20260609-WA0018.jpg", text: "Momen keagamaan yang membawa kedamaian dan keteduhan di hati kita.", phase: "Memori 15/43" },
            { time: 61, img: "IMG-20260609-WA0019.jpg", text: "Berbalut seragam kebanggaan, kita tumbuh menjadi pribadi yang mandiri.", phase: "Memori 16/43" },
            { time: 65, img: "IMG-20260609-WA0020.jpg", text: "Kunjungan, senyuman, dan pelukan hangat di ruang lingkup sekolah dasar.", phase: "Memori 17/43" },
            { time: 69, img: "IMG-20260609-WA0021.jpg", text: "Petualangan luar kelas yang mengajarkan kita tentang arti dunia luar.", phase: "Memori 18/43" },
            { time: 73, img: "IMG-20260609-WA0023.jpg", text: "Menikmati hidangan bersama saat momen silaturahmi penuh berkah.", phase: "Memori 19/43" },
            { time: 77, img: "IMG-20260609-WA0024.jpg", text: "Setiap sudut sekolah ini punya cerita tersendiri yang tak tergantikan.", phase: "Memori 20/43" },
            { time: 81, img: "IMG-20260609-WA0025.jpg", text: "Berpose penuh gaya, melepas penat setelah seharian belajar keras.", phase: "Memori 21/43" },
            { time: 85, img: "IMG-20260609-WA0026.jpg", text: "Keceriaan acak yang membuktikan betapa indahnya masa-masa anak-anak.", phase: "Memori 22/43" },
            { time: 89, img: "IMG-20260609-WA0028.jpg", text: "Saat-saat seru berebut momentum kebahagiaan bersama sahabat dekat.", phase: "Memori 23/43" },
            { time: 93, img: "IMG-20260609-WA0029.jpg", text: "Kekompakan yang solid teruji dalam berbagai rintangan tugas sekolah.", phase: "Memori 24/43" },
            { time: 97, img: "IMG-20260609-WA0030.jpg", text: "Upacara dan kedisiplinan yang melatih jiwa nasionalisme di dada.", phase: "Memori 25/43" },
            { time: 101, img: "IMG-20260609-WA0031.jpg", text: "Senyum simpul penuh arti menatap kamera, menyimpan detik waktu.", phase: "Memori 26/43" },
            { time: 105, img: "IMG-20260609-WA0032.jpg", text: "Melangkah maju menyongsong kelulusan dengan keyakinan penuh.", phase: "Memori 27/43" },
            { time: 109, img: "IMG-20260609-WA0033.jpg", text: "Dukungan penuh dari bapak ibu guru yang tak lelah menuntun arah.", phase: "Memori 28/43" },
            { time: 113, img: "IMG-20260609-WA0035.jpg", text: "Momen peringatan hari besar nasional dengan identitas budaya lokal.", phase: "Memori 29/43" },
            { time: 117, img: "IMG-20260609-WA0036.jpg", text: "Kain batik dan kebaya yang menambah keanggunan serta kegagahan.", phase: "Memori 30/43" },
            { time: 121, img: "IMG-20260609-WA0037.jpg", text: "Formasi berjajar rapi, saksi bisu tumbuh kembang fisik dan mental.", phase: "Memori 31/43" },
            { time: 125, img: "IMG-20260609-WA0038.jpg", text: "Rasa kekeluargaan yang tertanam kuat mengalahkan ego masing-masing.", phase: "Memori 32/43" },
            { time: 129, img: "IMG-20260609-WA0039.jpg", text: "Kilas balik perjalanan panjang yang terasa berjalan begitu singkat.", phase: "Memori 33/43" },
            { time: 133, img: "IMG-20260609-WA0040.jpg", text: "Hari esok mungkin berbeda, namun memori di sini tetap abadi.", phase: "Memori 34/43" },
            { time: 137, img: "IMG-20260609-WA0043.jpg", text: "Persahabatan murni terjalin tulus tanpa mengharapkan pamrih apapun.", phase: "Memori 35/43" },
            { time: 141, img: "IMG-20260609-WA0044.jpg", text: "Bersiap mengemasi buku dan kenangan untuk dibawa ke tingkat lanjut.", phase: "Memori 36/43" },
            { time: 145, img: "IMG-20260609-WA0045.jpg", text: "Setiap sudut ruangan menyimpan gema tawa dan bisikan impian kita.", phase: "Memori 37/43" },
            { time: 149, img: "IMG-20260609-WA0046.jpg", text: "Terima kasih untuk pelukan hangat dan jabat tangan erat penguat jiwa.", phase: "Memori 38/43" },
            { time: 153, img: "IMG-20260609-WA0047.jpg", text: "Landasan pacu pertama kita telah sukses dilewati dengan selamat.", phase: "Memori 39/43" },
            { time: 157, img: "IMG-20260609-WA0048.jpg", text: "Kini pintu masa depan terbuka lebar menyambut petualangan baru.", phase: "Memori 40/43" },
            { time: 161, img: "IMG-20260609-WA0051.jpg", text: "Jika masa lalu kita adalah pesawat terbang yang mendarat di gerbang sekolah...", phase: "Memori 41/43" },
            { time: 165, img: "IMG-20260609-WA0053.jpg", text: "Maka impian kita di masa depan adalah Roket yang meluncur menembus batas langit!", phase: "Memori 42/43" },
            { time: 169, img: "IMG-20260609-WA0061.jpg", text: "Terima kasih Kelas VI SD Negeri Slarang 02. Sampai jumpa di puncak kesuksesan! 🚀✨", phase: "Memori Akhir: 43/43" }
        ];

        // ================= ENGINE TRANSISI ROKET & KEPULAN ASAP (100% Persis start.html) =================
        const triggerRocketTransition = (targetData) => {
            photoSlot.style.opacity = '0.1';
            photoSlot.style.filter = 'blur(15px) scale(0.95)';

            const rocket = document.createElement('div');
            rocket.className = 'trans-rocket';
            rocket.innerHTML = `
                <div class="rocket-body">
                    <div class="rocket-window"></div>
                    <div class="rocket-wing-left"></div>
                    <div class="rocket-wing-right"></div>
                </div>
                <div class="rocket-fire"></div>
            `;
            wrapperZone.appendChild(rocket);

            const wWidth = wrapperZone.offsetWidth;
            const wHeight = wrapperZone.offsetHeight;
            
          const startX = -60;
            const startY = wHeight + 60;
            const endX = wWidth + 60;
            const endY = -60;

            let startTime = null;
            let lastSmokeTime = 0;
            let dataSwapped = false;
            const duration = 1000;

            function runFlight(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = timestamp - startTime;
                const percent = Math.min(progress / duration, 1);

                const currentX = startX + (endX - startX) * percent;
                const currentY = startY + (endY - startY) * percent;

                rocket.style.left = `${currentX}px`;
                rocket.style.top = `${currentY}px`;

                if (timestamp - lastSmokeTime > 20 && percent < 0.95) {
                    lastSmokeTime = timestamp;
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke-particle';
                    
                    const jitterX = (Math.random() - 0.5) * 25;
                    const jitterY = (Math.random() - 0.5) * 25;
                    
                    smoke.style.left = `${currentX - 12 + jitterX}px`;
                    smoke.style.top = `${currentY + 15 + jitterY}px`;
                    
                    wrapperZone.appendChild(smoke);
                    setTimeout(() => smoke.remove(), 900);
                }

                if (percent >= 0.5 && !dataSwapped) {
                    dataSwapped = true;
                    photoSlot.src = targetData.img;
                    captionSlot.innerHTML = targetData.text;
                    progText.innerText = targetData.phase;

                    photoSlot.style.opacity = '1';
                    photoSlot.style.filter = 'blur(0px) scale(1)';
                }

                if (progress < duration) {
                    requestAnimationFrame(runFlight);
                } else {
                    rocket.remove();
                }
            }
            requestAnimationFrame(runFlight);
        };

        // ================= TIMELINE TRACKER CORE ENGINE (100% Persis) =================
        const startCinematicScene = () => {
            interactionLayer.style.opacity = '0';
            setTimeout(() => interactionLayer.style.display = 'none', 1000);

            memoriesAudio.play().catch(err => console.log("Audio Error:", err));
            displayBox.classList.add('active');

            let currentActiveIndex = -1;

            memoriesAudio.addEventListener('timeupdate', () => {
                const currentTime = memoriesAudio.currentTime;
                let targetIndex = currentActiveIndex;

                for (let i = 0; i < memoryTimeline.length; i++) {
                    if (currentTime >= memoryTimeline[i].time) {
                        targetIndex = i;
                    }
                }

                if (targetIndex !== currentActiveIndex && targetIndex !== -1) {
                    currentActiveIndex = targetIndex;
                    triggerRocketTransition(memoryTimeline[currentActiveIndex]);

                    // JIKA SAMPAI DI SLIDE PALING AKHIR (FOTO KE-43)
                    if (currentActiveIndex === memoryTimeline.length - 1) {
                        setTimeout(() => {
                            btnLanjut.classList.add('show');
                        }, 2000);
                    }
                }
            });
        };

        btnMulaiSkenario.addEventListener('click', startCinematicScene);
    </script>
</body>
</html>
