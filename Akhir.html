<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akhir Perjalanan Kita 🚀</title>
    <style>
        /* --- RESET & THEME (Persis start_3.html) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020208;
            color: #fff;
        }

        /* --- BACKGROUND LANGIT BIRU CERAH (Lanjutan Pan-Down) --- */
        .sky-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            background: linear-gradient(to bottom, #0284c7, #38bdf8, #bae6fd, #f0f9ff);
            z-index: 1;
            overflow: hidden;
        }

        /* Efek Awan Putih Estetik (Persis start_3.html) */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 100px;
            filter: blur(1px);
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); border-radius: 50%;
        }
        .cloud1 { width: 300px; height: 80px; top: 25%; left: -50px; opacity: 0.8; animation: floatClouds 30s linear infinite; }
        .cloud2 { width: 200px; height: 60px; top: 50%; right: -50px; opacity: 0.6; animation: floatClouds 20s linear infinite reverse; }

        @keyframes floatClouds {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(110vw); }
        }

        /* --- CONTAINER UTAMA CINEMATIC (Persis start_3.html) --- */
        .cinema-container {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- INTERACTIVE PROMPT LAYER (Persis start_3.html) --- */
        #interaction-layer {
            position: absolute;
            width: 100%; height: 100%;
            background: rgba(2, 2, 8, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease;
        }
        .play-box {
            text-align: center;
            cursor: pointer;
            padding: 30px;
            border: 2px dashed #ffdd1a;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            animation: pulseBox 2s infinite alternate;
        }
        @keyframes pulseBox {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,221,26,0.2); }
            100% { transform: scale(1.03); box-shadow: 0 0 30px rgba(255,221,26,0.5); }
        }

        /* --- BINGKAI FOTO FILM & NARASI (Persis start_3.html) --- */
        .memory-card {
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .memory-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 350px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 4px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            background: #000;
        }

        #photoSlot {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1);
            filter: blur(0px);
            opacity: 1;
            transition: transform 6s linear, filter 0.4s ease, opacity 0.4s ease;
        }

        .narrative-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f1f5f9;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- TOMBOL SELESAI / KEMBALI (Persis gaya btnLanjut start_3.html) --- */
        #btnSelesai {
            display: none;
            margin-top: 25px;
            padding: 14px 40px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #020208;
            background: #ffdd1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 221, 26, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 80;
            opacity: 0;
            transform: translateY(10px);
            animation: bounceBtn 1s infinite alternate;
            text-decoration: none;
        }
        #btnSelesai.show {
            display: inline-block;
            opacity: 1;
            transform: translateY(0);
        }
        #btnSelesai:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 221, 26, 0.9);
            background: #fff;
        }
        @keyframes bounceBtn {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        /* --- DETIL ELEMEN ASAP & ROKET TRANSISI (Persis start_3.html) --- */
        .trans-rocket {
            position: absolute;
            z-index: 50;
            width: 50px;
            height: 100px;
            pointer-events: none;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .smoke-particle {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, rgba(241, 245, 249, 0.9) 0%, rgba(148, 163, 184, 0.5) 50%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 40;
            animation: smokePuff 0.9s forwards ease-out;
        }

        @keyframes smokePuff {
            0% { transform: scale(1) translate(0, 0); opacity: 0.8; filter: blur(2px); }
            40% { opacity: 1; filter: blur(6px); }
            100% { transform: scale(6) translate(-30px, 20px); opacity: 0; filter: blur(15px); }
        }

        /* --- DESAIN ROKET ENGINE (Persis start_3.html) --- */
        .rocket-body {
            width: 30px; height: 65px;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            border-radius: 50% 50% 4px 4px / 70% 70% 4px 4px;
            position: relative; margin: 0 auto;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .rocket-window {
            width: 10px; height: 10px;
            background: #38bdf8; border: 2px solid #94a3b8;
            border-radius: 50%; position: absolute;
            top: 18px; left: 8px;
        }
        .rocket-wing-left {
            width: 0; height: 0;
            border-right: 12px solid #ef4444;
            border-top: 25px solid transparent;
            position: absolute; bottom: 0; left: -12px;
        }
        .rocket-wing-right {
            width: 0; height: 0;
            border-left: 12px solid #ef4444;
            border-top: 25px solid transparent;
            position: absolute; bottom: 0; right: -12px;
        }
        .rocket-fire {
            width: 14px; height: 30px;
            background: linear-gradient(to bottom, #ffdd1a, #ef4444, transparent);
            margin: -2px auto 0; border-radius: 0 0 8px 8px;
            animation: fireBurn 0.08s infinite alternate;
        }

        @keyframes fireBurn {
            0% { height: 25px; opacity: 0.9; }
            100% { height: 35px; opacity: 1; filter: blur(1px); }
        }

        .progress-indicator {
            position: absolute;
            top: 20px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- TOMBOL PEMBUKA GESTURE AUDIO (Persis) -->
    <div id="interaction-layer">
        <div class="play-box" id="btnMulaiSkenario">
            <h2 style="color: #ffdd1a; margin-bottom: 10px;">🎬 Lihat Memoar Akhir Semesta 🌟</h2>
            <p style="font-size: 0.9rem; color: #94a3b8;">Ketuk layar untuk memutar bagian penutup</p>
        </div>
    </div>

    <!-- BACKGROUND ENGINE LANGIT -->
    <div class="sky-bg">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <!-- AUDIO ENGINE (Lagu Penutup) -->
    <audio id="memoriesAudio" preload="auto">
        <source src="VID-20260610-WA0019.mp3" type="audio/mpeg">
    </audio>

    <!-- CINEMATIC STAGE (Persis) -->
    <div class="cinema-container">
        <div class="progress-indicator" id="progText">Memulai Lembar Akhir...</div>

        <!-- BINGKAI FOTO UTAMA (Persis 100% Sesuai File Kiriman Lu) -->
        <div class="memory-card" id="displayBox">
            <div class="image-wrapper" id="wrapperZone">
                <img src="" id="photoSlot" alt="Memories">
            </div>
            <div class="narrative-text" id="captionSlot">Membuka memoar penutup...</div>
        </div>

        <!-- TOMBOL SELESAI KEMBALI KERSIS GAYA SEBELUMNYA -->
        <a href="index.html" id="btnSelesai">Kembali ke Beranda 🏠</a>
    </div>

    <script>
        const btnMulaiSkenario = document.getElementById('btnMulaiSkenario');
        const interactionLayer = document.getElementById('interaction-layer');
        const memoriesAudio = document.getElementById('memoriesAudio');
        const displayBox = document.getElementById('displayBox');
        const wrapperZone = document.getElementById('wrapperZone');
        const photoSlot = document.getElementById('photoSlot');
        const captionSlot = document.getElementById('captionSlot');
        const progText = document.getElementById('progText');
        const btnSelesai = document.getElementById('btnSelesai');

        // TIMELINE MEMOAR PENUTUP BERDASARKAN DETIK AUDIO (BERSIH TANPA NAMA SISWA)
        const memoryTimeline = [
            {
                time: 1, 
                img: "IMG-20260609-WA0061.jpg",
                text: "Setiap perjalanan hebat selalu memiliki landasan pacu pertamanya. Enam tahun lalu kita datang ke sini dengan langkah kecil penuh kepolosan.",
                phase: "Memoar I: Langkah Awal"
            },
            {
                time: 15, 
                img: "IMG-20260609-WA0042.jpg",
                text: "Hari-hari berganti, menganyam tawa di sela jam istirahat, hingga menyatukan ego menjadi ikatan keluarga besar Kelas VI SD Negeri Slarang 02.",
                phase: "Memoar II: Ikatan Kabin"
            },
            {
                time: 35, 
                img: "IMG-20260609-WA0061.jpg",
                text: "Kebersamaan kita selama ini ibarat sebuah Pesawat Penumpang. Armada hangat tempat kita duduk berdampingan melintasi tahun-tahun sekolah.",
                phase: "Memoar III: Pesawat Kenangan"
            },
            {
                time: 55, 
                img: "IMG-20260609-WA0042.jpg",
                text: "Kini, pesawat kenangan itu telah mendarat dengan sangat sempurna di gerbang kelulusan. Pintu kabin terbuka, menandakan tugasnya usai.",
                phase: "Memoar IV: Gerbang Kelulusan"
            },
            {
                time: 75, 
                img: "IMG-20260609-WA0061.jpg",
                text: "Namun ingatlah, jika masa lalu adalah Pesawat yang harus mendarat, maka cita-cita dan impian di dalam dada kita adalah sebuah ROKET!",
                phase: "Memoar V: Energi Impian"
            },
            {
                time: 95, 
                img: "IMG-20260609-WA0042.jpg",
                text: "Sebuah Roket tidak mengenal kata mendarat. Ia dirancang untuk melesat menembus atmosfer ketakutan dan meraih mimpi paling tinggi di angkasa.",
                phase: "Memoar VI: Melesat Tinggi"
            },
            {
                time: 115, 
                img: "IMG-20260609-WA0061.jpg",
                text: "Penerbangan bersama kita resmi berakhir di sini, namun penjelajahan ruang angkasa masa depan baru saja dimulai. Sampai jumpa di masa depan! ✨🚀",
                phase: "Selesai: Menuju Angkasa Masa Depan"
            }
        ];

        // ================= CORE ENGINE TRANSISI ROKET (Persis) =================
        const triggerRocketTransition = (targetData) => {
            photoSlot.style.opacity = '0.1';
            photoSlot.style.filter = 'blur(15px) scale(0.95)';

            const rocket = document.createElement('div');
            rocket.className = 'trans-rocket';
            rocket.innerHTML = `
                <div class="rocket-body">
                    <div class="rocket-window"></div>
                    <div class="rocket-wing-left"></div>
                    <div class="rocket-wing-right"></div>
                </div>
                <div class="rocket-fire"></div>
            `;
            wrapperZone.appendChild(rocket);

            const wWidth = wrapperZone.offsetWidth;
            const wHeight = wrapperZone.offsetHeight;
            
            const startX = -60;
            const startY = wHeight + 60;
            const endX = wWidth + 60;
            const endY = -60;

            let startTime = null;
            let lastSmokeTime = 0;
            let dataSwapped = false;
            const duration = 1000;

            function runFlight(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = timestamp - startTime;
                const percent = Math.min(progress / duration, 1);

                const currentX = startX + (endX - startX) * percent;
                const currentY = startY + (endY - startY) * percent;

                rocket.style.left = `${currentX}px`;
                rocket.style.top = `${currentY}px`;

                if (timestamp - lastSmokeTime > 20 && percent < 0.95) {
                    lastSmokeTime = timestamp;
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke-particle';
                    
                    const jitterX = (Math.random() - 0.5) * 25;
                    const jitterY = (Math.random() - 0.5) * 25;
                    
                    smoke.style.left = `${currentX - 12 + jitterX}px`;
                    smoke.style.top = `${currentY + 15 + jitterY}px`;
                    
                    wrapperZone.appendChild(smoke);
                    setTimeout(() => smoke.remove(), 900);
                }

                if (percent >= 0.5 && !dataSwapped) {
                    dataSwapped = true;
                    photoSlot.src = targetData.img;
                    captionSlot.innerHTML = targetData.text;
                    progText.innerText = targetData.phase;

                    photoSlot.style.opacity = '1';
                    photoSlot.style.filter = 'blur(0px) scale(1)';
                }

                if (progress < duration) {
                    requestAnimationFrame(runFlight);
                } else {
                    rocket.remove();
                }
            }
            requestAnimationFrame(runFlight);
        };

        // ================= TIMELINE TRACKER CORE ENGINE (Persis) =================
        const startCinematicScene = () => {
            interactionLayer.style.opacity = '0';
            setTimeout(() => interactionLayer.style.display = 'none', 1000);

            memoriesAudio.play().catch(err => console.log("Audio Error:", err));
            displayBox.classList.add('active');

            let currentActiveIndex = -1;

            memoriesAudio.addEventListener('timeupdate', () => {
                const currentTime = memoriesAudio.currentTime;
                let targetIndex = currentActiveIndex;

                for (let i = 0; i < memoryTimeline.length; i++) {
                    if (currentTime >= memoryTimeline[i].time) {
                        targetIndex = i;
                    }
                }

                if (targetIndex !== currentActiveIndex && targetIndex !== -1) {
                    currentActiveIndex = targetIndex;
                    triggerRocketTransition(memoryTimeline[currentActiveIndex]);

                    // Jika sampai di slide paling akhir, munculkan tombol selesai
                    if (currentActiveIndex === memoryTimeline.length - 1) {
                        setTimeout(() => {
                            btnSelesai.classList.add('show');
                        }, 1500);
                    }
                }
            });
        };

        btnMulaiSkenario.addEventListener('click', startCinematicScene);
    </script>
</body>
    </html>
