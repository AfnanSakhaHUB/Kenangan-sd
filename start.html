<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perjalanan Kenangan Kita 🚀</title>
    <style>
        /* --- RESET & SPACE THEME --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020208;
            color: #fff;
        }

        /* --- BACKGROUND ANTARIKSA BERGERAK TURUN --- */
        .space-bg {
            position: absolute;
            width: 100%;
            height: 200%;
            top: 0; left: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, #fff 1px, transparent 2px),
                radial-gradient(circle at 75% 60%, #fff 1.5px, transparent 3px),
                radial-gradient(circle at 50% 10%, rgba(255,255,255,0.4) 2px, transparent 40px),
                radial-gradient(circle at 85% 85%, #fff 1px, transparent 2px);
            background-size: 300px 300px, 400px 400px;
            animation: spaceScroll 25s linear infinite;
            z-index: 1;
        }

        @keyframes spaceScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .nebula {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(58, 143, 253, 0.15) 0%, transparent 70%);
            top: 20%; left: -10%;
            border-radius: 50%;
            z-index: 2;
            animation: floatNebula 10s ease-in-out infinite alternate;
        }
        @keyframes floatNebula {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.2); }
        }

        /* --- CONTAINER UTAMA CINEMATIC --- */
        .cinema-container {
            position: relative;
            width: 100%;
            height: 100vh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- INTERACTIVE PROMPT LAYER --- */
        #interaction-layer {
            position: absolute;
            width: 100%; height: 100%;
            background: rgba(2, 2, 8, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease;
        }
        .play-box {
            text-align: center;
            cursor: pointer;
            padding: 30px;
            border: 2px dashed #ffdd1a;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            animation: pulseBox 2s infinite alternate;
        }
        @keyframes pulseBox {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,221,26,0.2); }
            100% { transform: scale(1.03); box-shadow: 0 0 30px rgba(255,221,26,0.5); }
        }

        /* --- BINGKAI FOTO FILM & NARASI --- */
        .memory-card {
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .memory-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 350px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 4px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            background: #000;
        }

        #photoSlot {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1);
            filter: blur(0px);
            opacity: 1;
            transition: transform 6s linear, filter 0.4s ease, opacity 0.4s ease;
        }

        .narrative-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f1f5f9;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- DETIL TRIGER ELEMEN ASAP & ROKET TERBANG TRANSISI --- */
        .trans-rocket {
            position: absolute;
            z-index: 50;
            width: 50px;
            height: 100px;
            pointer-events: none;
            transform: translate(-50%, -50%) rotate(45deg); /* Arah serong kanan atas */
        }

        .smoke-particle {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, rgba(241, 245, 249, 0.9) 0%, rgba(148, 163, 184, 0.5) 50%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 40;
            animation: smokePuff 0.9s forwards ease-out;
        }

        @keyframes smokePuff {
            0% { transform: scale(1) translate(0, 0); opacity: 0.8; filter: blur(2px); }
            40% { opacity: 1; filter: blur(6px); }
            100% { transform: scale(6) translate(-30px, 20px); opacity: 0; filter: blur(15px); }
        }

        /* --- DESAIN ROKET ENGINE (CSS MURNI) --- */
        .rocket-body {
            width: 30px; height: 65px;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            border-radius: 50% 50% 4px 4px / 70% 70% 4px 4px;
            position: relative; margin: 0 auto;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .rocket-window {
            width: 10px; height: 10px;
            background: #38bdf8; border: 2px solid #94a3b8;
            border-radius: 50%; position: absolute;
            top: 18px; left: 8px;
        }
        .rocket-wing-left {
            width: 0; height: 0;
            border-right: 12px solid #ef4444;
            border-top: 25px solid transparent;
            position: absolute; bottom: 0; left: -12px;
        }
        .rocket-wing-right {
            width: 0; height: 0;
            border-left: 12px solid #ef4444;
            border-top: 25px solid transparent;
            position: absolute; bottom: 0; right: -12px;
        }
        .rocket-fire {
            width: 14px; height: 30px;
            background: linear-gradient(to bottom, #ffdd1a, #ef4444, transparent);
            margin: -2px auto 0; border-radius: 0 0 8px 8px;
            animation: fireBurn 0.08s infinite alternate;
        }

        @keyframes fireBurn {
            0% { height: 25px; opacity: 0.9; }
            100% { height: 35px; opacity: 1; filter: blur(1px); }
        }

        /* --- WATERMARK PROGRESS --- */
        .progress-indicator {
            position: absolute;
            top: 20px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- TOMBOL PEMBUKA GESTURE AUDIO -->
    <div id="interaction-layer">
        <div class="play-box" id="btnMulaiSkenario">
            <h2 style="color: #ffdd1a; margin-bottom: 10px;">🚀 Buka Lembar Kenangan 🌟</h2>
            <p style="font-size: 0.9rem; color: #94a3b8;">Ketuk layar untuk memulai perjalanan sinematik</p>
        </div>
    </div>

    <!-- BACKGROUND ENGINE -->
    <div class="space-bg"></div>
    <div class="nebula"></div>

    <!-- AUDIO ENGINE -->
    <audio id="memoriesAudio" preload="auto">
        <source src="one-piece-song_ed01-memories-maki-otsuki.mp3" type="audio/mpeg">
    </audio>

    <!-- CINEMATIC STAGE -->
    <div class="cinema-container">
        <div class="progress-indicator" id="progText">Bersiap Meluncur...</div>

        <!-- BINGKAI FOTO UTAMA -->
        <div class="memory-card" id="displayBox">
            <div class="image-wrapper" id="wrapperZone">
                <img src="" id="photoSlot" alt="Memories">
            </div>
            <div class="narrative-text" id="captionSlot">Mempersiapkan mesin waktu...</div>
        </div>
    </div>

    <script>
        const btnMulaiSkenario = document.getElementById('btnMulaiSkenario');
        const interactionLayer = document.getElementById('interaction-layer');
        const memoriesAudio = document.getElementById('memoriesAudio');
        const displayBox = document.getElementById('displayBox');
        const wrapperZone = document.getElementById('wrapperZone');
        const photoSlot = document.getElementById('photoSlot');
        const captionSlot = document.getElementById('captionSlot');
        const progText = document.getElementById('progText');

        // ==========================================================================
        // DATABASE TIMELINE KRONOLOGIS BERDASARKAN DETIK LAGU MEMORIES (100% AKURAT)
        // ==========================================================================
        const memoryTimeline = [
            // --- BABAK I: MPLS ---
            {
                time: 1, 
                img: "IMG-20260609-WA0041.jpg",
                text: "Langkah awal perjalanan kita dimulai dari sini... Masih ingat kan momen MPLS yang penuh kepolosan dengan baju merah putih ini?",
                phase: "Babak I: Awal Cerita (MPLS)"
            },
            {
                time: 15, 
                img: "IMG-20260609-WA0052.jpg",
                text: "Berdiri berjejer, menatap masa depan yang masih misterius. Di titik inilah takdir mempertemukan kita semua dalam satu ikatan kelas.",
                phase: "Babak I: Awal Cerita (MPLS)"
            },

            // --- BABAK II: FOTO BERSAMA KELAS 5 ---
            {
                time: 35, 
                img: "IMG-20260609-WA0010.jpg",
                text: "Waktu berlalu cepat hingga kita menginjak bangku Kelas 5. Berdiri tegak bersama, mulai kompak dan memahami arti kebersamaan.",
                phase: "Babak II: Kebersamaan Kelas 5"
            },
            {
                time: 55, 
                img: "IMG-20260609-WA0042.jpg",
                text: "Formasi lengkap foto sekelas! Senyum-senyum di wajah kita menggambarkan hari-hari sekolah yang penuh warna dan canda tawa.",
                phase: "Babak II: Kebersamaan Kelas 5"
            },

            // --- BABAK III: STUDYTOUR YOGYAKARTA PAS KELAS 5 ---
            {
                time: 75, 
                img: "IMG-20260609-WA0050.jpg",
                text: "Nah, ini dia petualangan terbesar kita pas kelas 5! Studytour seru ke Yogyakarta dengan seragam biru kebanggaan kita.",
                phase: "Babak III: Petualangan Jogja (Kelas 5)"
            },
            {
                time: 95, 
                img: "IMG-20260609-WA0058.jpg",
                text: "Menyusuri tempat bersejarah di Jogja bareng teman-teman terdekat. Capeknya jalan kaki langsung hilang karena kita lewati bareng-bareng.",
                phase: "Babak III: Petualangan Jogja (Kelas 5)"
            },

            // --- BABAK IV: BUKA BERSAMA DI RUMAH BU KHAYA ---
            {
                time: 120, 
                img: "IMG-20260609-WA0022.jpg",
                text: "Momen legendaris bulan Ramadhan di rumah wali kelas kita, Bu Khaya. Berbondong-bondong datang demi silaturahmi sekaligus mengincar takjil.",
                phase: "Babak IV: Bukber Rumah Bu Khaya"
            },
            {
                time: 140, 
                img: "IMG-20260609-WA0027.jpg",
                text: "Kocaknya pas momen war takjil di sini, kita cuma kebagian dikit doang! Sampai-sampai lupa dapet berapa karena rebutan saking serunya haha.",
                phase: "Babak IV: Bukber Rumah Bu Khaya"
            },

            // --- BABAK V: BUKA BERSAMA DI RUMAH LULA ---
            {
                time: 165, 
                img: "IMG-20260609-WA0015.jpg",
                text: "Kalau yang ini pas kita bukber di rumah Lula! Di sini aman, nggak ada drama war takjil rebutan makanan, soalnya hidangan di rumah Lula enak-enak banget!",
                phase: "Babak V: Bukber Rumah Lula"
            },

            // --- BABAK VI: PERAYAAN MAULID NABI ---
            {
                time: 190, 
                img: "IMG-20260609-WA0014.jpg",
                text: "Kembali ke momen religius sekolah saat memperingati Maulid Nabi. Adem banget melihat semuanya kompak memakai baju muslim dan gamis.",
                phase: "Babak VI: Berkah Maulid Nabi"
            },
            {
                time: 210, 
                img: "IMG-20260609-WA0034.jpg",
                text: "Duduk bersama mendengarkan ceramah dan bersholawat. Kedekatan kita bukan cuma soal main, tapi juga dalam momentum kebaikan.",
                phase: "Babak VI: Berkah Maulid Nabi"
            },

            // --- BABAK VII: HARI BATIK NASIONAL & OUTRO ---
            {
                time: 230, 
                img: "IMG-20260609-WA0049.jpg",
                text: "Hari Batik Nasional! Gagah dan anggun berbalut warisan budaya. Kita yang dulu anak-anak polos, kini sudah tumbuh semakin dewasa.",
                phase: "Babak VII: Hari Batik Nasional"
            },
            {
                time: 250, 
                img: "IMG-20260609-WA0061.jpg",
                text: "Waktu boleh berlalu dan sekolah kita boleh usai, tapi roket kenangan ini akan terus terbang tinggi membawa nama persahabatan kita ke angkasa. Terima kasih untuk memori indah ini! ✨🚀",
                phase: "Akhir Perjalanan: Menuju Masa Depan"
            }
        ];

        // ================= ENGINE TRANSISI ROKET & KEPULAN ASAP =================
        const triggerRocketTransition = (targetData) => {
            // 1. Gambar lama langsung masuk fase redup & blur
            photoSlot.style.opacity = '0.1';
            photoSlot.style.filter = 'blur(15px) scale(0.95)';

            // 2. Spawn objek roket transisi
            const rocket = document.createElement('div');
            rocket.className = 'trans-rocket';
            rocket.innerHTML = `
                <div class="rocket-body">
                    <div class="rocket-window"></div>
                    <div class="rocket-wing-left"></div>
                    <div class="rocket-wing-right"></div>
                </div>
                <div class="rocket-fire"></div>
            `;
            wrapperZone.appendChild(rocket);

            // Parameter Dimensi Lintasan Serong
            const wWidth = wrapperZone.offsetWidth;
            const wHeight = wrapperZone.offsetHeight;
            
            const startX = -60;
            const startY = wHeight + 60;
            const endX = wWidth + 60;
            const endY = -60;

            let startTime = null;
            let lastSmokeTime = 0;
            let dataSwapped = false;
            const duration = 1000; // Durasi roket melesat melewati layar (1 detik)

            function runFlight(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = timestamp - startTime;
                const percent = Math.min(progress / duration, 1);

                // Hitung koordinat pergerakan linear serong
                const currentX = startX + (endX - startX) * percent;
                const currentY = startY + (endY - startY) * percent;

                rocket.style.left = `${currentX}px`;
                rocket.style.top = `${currentY}px`;

                // Spawn partikel asap secara berkala saat roket bergerak
                if (timestamp - lastSmokeTime > 20 && percent < 0.95) {
                    lastSmokeTime = timestamp;
                    const smoke = document.createElement('div');
                    smoke.className = 'smoke-particle';
                    
                    // Berikan variasi sebaran agar asap terasa bervolume alami
                    const jitterX = (Math.random() - 0.5) * 25;
                    const jitterY = (Math.random() - 0.5) * 25;
                    
                    smoke.style.left = `${currentX - 12 + jitterX}px`;
                    smoke.style.top = `${currentY + 15 + jitterY}px`;
                    
                    wrapperZone.appendChild(smoke);
                    setTimeout(() => smoke.remove(), 900); // Bersihkan sisa asap
                }

                // MOMEN EMAS: Ketika roket berada tepat di tengah layar (asap menutupi gambar)
                if (percent >= 0.5 && !dataSwapped) {
                    dataSwapped = true;
                    // Tukar konten internal di balik kabut asap
                    photoSlot.src = targetData.img;
                    captionSlot.innerHTML = targetData.text;
                    progText.innerText = targetData.phase;

                    // Buat gambar baru materialisasi keluar dari blur secara estetik
                    photoSlot.style.opacity = '1';
                    photoSlot.style.filter = 'blur(0px) scale(1)';
                }

                if (progress < duration) {
                    requestAnimationFrame(runFlight);
                } else {
                    rocket.remove(); // Hapus objek roket setelah keluar layar
                }
            }
            requestAnimationFrame(runFlight);
        };

        // ================= TIMELINE TRACKER CORE ENGINE =================
        const startCinematicScene = () => {
            interactionLayer.style.opacity = '0';
            setTimeout(() => interactionLayer.style.display = 'none', 1000);

            memoriesAudio.play().catch(err => console.log("Audio Error:", err));
            displayBox.classList.add('active');

            let currentActiveIndex = -1;

            memoriesAudio.addEventListener('timeupdate', () => {
                const currentTime = memoriesAudio.currentTime;
                let targetIndex = currentActiveIndex;

                for (let i = 0; i < memoryTimeline.length; i++) {
                    if (currentTime >= memoryTimeline[i].time) {
                        targetIndex = i;
                    }
                }

                // Trigger perubahan slide jika waktu mencukupi & indeks berubah
                if (targetIndex !== currentActiveIndex && targetIndex !== -1) {
                    currentActiveIndex = targetIndex;
                    triggerRocketTransition(memoryTimeline[currentActiveIndex]);
                }
            });

            // Loop Otomatis jika lagu habis
            memoriesAudio.addEventListener('ended', () => {
                memoriesAudio.currentTime = 0;
                memoriesAudio.play();
            });
        };

        btnMulaiSkenario.addEventListener('click', startCinematicScene);
    </script>
</body>
</html>
