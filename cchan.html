<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerdas Cermat</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', sans-serif; 
            color: #000000; /* Semua teks default dipaksa warna hitam gelap */
        }
        body { 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 900px; 
            text-align: center; 
        }
        .hidden { 
            display: none !important; 
        }
        input { 
            padding: 12px; 
            width: 80%; 
            max-width: 300px; 
            margin: 15px 0; 
            border: 2px solid #333333; 
            border-radius: 6px; 
            font-size: 16px;
            color: #000000;
        }
        
        /* Tombol Utama: Kuning cerah, teks hitam tebal agar sangat terbaca */
        button.main-btn { 
            padding: 12px 25px; 
            background: #ffc107; 
            color: #000000; 
            border: 2px solid #333333; 
            border-radius: 6px; 
            cursor: pointer; 
            margin: 5px; 
            font-weight: bold;
            font-size: 16px;
        }
        button.main-btn:hover { 
            background: #e0a800; 
        }
        
        .game-layout { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 20px; 
            margin-top: 20px; 
        }
        .side-image { 
            width: 150px; 
            height: 150px; 
            border-radius: 8px; 
            object-fit: cover; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
        }
        .quiz-area { 
            flex: 1; 
        }
        .header-info { 
            display: flex; 
            justify-content: space-between; 
            background: #e9ecef; 
            padding: 12px 20px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            font-weight: bold; 
            border: 1px solid #ccc;
        }
        
        /* Opsi Jawaban Default: Latar belakang putih, tulisan hitam pekat */
        .option-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 10px; 
            background: #ffffff; 
            border: 2px solid #333333; 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 16px; 
            font-weight: bold;
            color: #000000;
            transition: all 0.2s; 
        }
        .option-btn:hover { 
            background: #f0f0f0; 
        }
        
        /* Gaya Papan Peringkat (Leaderboard) */
        .leaderboard-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
        }
        .leaderboard-table th, .leaderboard-table td { 
            padding: 12px; 
            border-bottom: 1px solid #333333; 
            text-align: center; 
            color: #000000;
        }
        .leaderboard-table th { 
            background: #e9ecef; 
            font-weight: bold;
        }
    </style>
</head>

            <br>

                    <div id="options-container"></div>
                </div>
                <img id="right-img" class="side-image" src="" alt="Kanan">
            </div>
        </div>

            <button class="main-btn" onclick="startGame()">Main Lagi</button>
            <button class="main-btn" onclick="window.location.href='index.html'" style="background: #e9ecef;">Kembali ke Menu Utama</button>

            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Peringkat</th>
                        <th>Nama</th>
                        <th>Skor</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>

        // Fungsi pembantu untuk mengacak array pertanyaan (Fisher-Yates Shuffle)
        function shuffleQuestions(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.startGame = () => {
            name = document.getElementById("player-name-input").value.trim() || "Pemain Anonim";
            score = 0; 
            currentIdx = 0;
            
            // PENTING: Mengacak database pertanyaan setiap kali game baru dimulai
            shuffleQuestions(questions);
            
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("end-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("display-name").innerText = "Pemain: " + name;
            document.getElementById("display-score").innerText = "Skor: " + score;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIdx >= questions.length) return endGame();
            clearInterval(timerInterval);
            
            // ========================================================
            // SISTEM TIMER BERKURANG SECARA BERTAHAP (SOAL AKHIR = 3s)
            // ========================================================
            const waktuMulai = 15; // Waktu soal pertama (Detik)
            const waktuAkhir = 3;  // Waktu soal terakhir (Detik)
            
            if (questions.length > 1) {
                timeLeft = waktuMulai - Math.round((waktuMulai - waktuAkhir) * (currentIdx / (questions.length - 1)));
            } else {
                timeLeft = waktuAkhir;
            }
            
            canAnswer = true;
            updateTimerDisplay();
            
            document.getElementById("left-img").src = leftAnswering;
            document.getElementById("right-img").src = rightDefault;
            
            // PENTING: Mengambil teks pertanyaan murni saja (Tanpa Penomoran Angka)
            document.getElementById("question").innerText = questions[currentIdx].question;
            
            const container = document.getElementById("options-container");
            container.innerHTML = "";
            
            questions[currentIdx].answers.forEach((ans, i) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = ans;
                btn.onclick = () => checkAnswer(i);
                container.appendChild(btn);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    checkAnswer(-1); // Kalah karena kehabisan waktu
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById("display-timer").innerText = "Waktu: " + timeLeft + "s";
        }

        window.checkAnswer = (idx) => {
            if (!canAnswer) return;
            canAnswer = false; 
            clearInterval(timerInterval);

            const correct = questions[currentIdx].correct;
            const container = document.getElementById("options-container");

                score += 25;
                document.getElementById("left-img").src = leftCorrect;
                document.getElementById("right-img").src = rightCorrect;
                document.getElementById("display-score").innerText = "Skor: " + score;
                
                if(buttons[idx]) {
                    buttons[idx].style.background = "#d4edda";
                    buttons[idx].style.borderColor = "#c3e6cb";
                    buttons[idx].style.color = "#155724";
                }
                
                setTimeout(() => { 
                    currentIdx++; 
                    loadQuestion(); 
                }, 1000);

            } else {
                // JIKA SALAH ATAU TIMEOUT: Latar merah lembut, teks merah tua gelap
                if (idx !== -1 && buttons[idx]) {
                    buttons[idx].style.background = "#f8d7da";
                    buttons[idx].style.borderColor = "#f5c6cb";
                    buttons[idx].style.color = "#721c24";
                }
                
                // Memberikan highlight hijau lembut pada tombol yang harusnya benar
                if (buttons[correct]) {
                    buttons[correct].style.background = "#d4edda";
                    buttons[correct].style.borderColor = "#c3e6cb";
                    buttons[correct].style.color = "#155724";
                }

                // Beri jeda 1.5 detik agar melihat koreksi jawaban, lalu langsung game over
                setTimeout(() => { 
                    endGame(); 
                }, 1500);
            }
        }

        async function endGame() {
            clearInterval(timerInterval);
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("end-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = score;
            
            const gameCollection = collection(db, "leaderboard_cerdas_cermat");

            try {
                // Kirim skor ke koleksi khusus cerdas cermat
                await addDoc(gameCollection, { name, score, time: new Date() });
                
                // Membaca Top 5 Skor Tertinggi khusus game ini
                const snapshot = await getDocs(query(gameCollection, orderBy("score", "desc"), limit(5)));
                
                let html = "";
                let rank = 1;
                snapshot.forEach(doc => {
                    html += `<tr><td>${rank++}</td><td>${doc.data().name}</td><td><strong>${doc.data().score}</strong></td></tr>`;
                });
                document.getElementById("leaderboard-body").innerHTML = html;
            } catch (error) {
                console.error("Error leaderboard:", error);
                document.getElementById("leaderboard-body").innerHTML = `<tr><td colspan="3">Gagal memuat skor.</td></tr>`;
            }
        }
    </script>
</body>
</html>
