<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelulusan Epik 2026</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-viewport">

        <div id="space-scene">
            <div class="space-stars"></div>
        </div>

            <div class="sky">
                <div class="sun"></div>
                <div class="bird bird1"></div>
                <div class="bird bird2"></div>
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
            </div>

            <div class="container">
                <div id="start-node" class="balloon-group">
                    <div class="balloon">
                        <div class="balloon-text">Mulai?</div>
                    </div>
                </div>

                <div id="menu-node" class="menu-balloons hidden">
                    <div id="btn-kenangan" class="balloon-group b-1">
                        <div class="balloon"><div class="balloon-text">Foto<br>Kenangan</div></div>
                    </div>
                    <div id="btn-kritik" class="balloon-group b-2">
                        <div class="balloon"><div class="balloon-text">Kritik &<br>Saran</div></div>
                    </div>
                    <div id="btn-minigames" class="balloon-group b-3">
                        <div class="balloon"><div class="balloon-text">Mini games</div></div>
                    </div>
                </div>

                <div id="kritik-panel" class="kritik-panel hidden">
                    <div class="kritik-left">
                        <div>
                            <h2 class="panel-title">Kritik & Saran</h2>
                            <form id="kritik-form" onsubmit="submitKritik(event)">
                                <div class="form-group">
                                    <label>Nama:</label>
                                    <input type="text" id="form-nama" required placeholder="Maksimal 5 kata...">
                                </div>
                                <div class="form-group">
                                    <label>Kata-kata:</label>
                                    <textarea id="form-kata" maxlength="500" required placeholder="Tulis pesanmu di sini (maks 500 karakter)..."></textarea>
                                </div>
                                <button type="submit" class="game-btn" style="margin-bottom:0; padding:12px;">Kirim Bubble</button>
                            </form>
                        </div>
                        <button class="game-btn btn-back" id="btn-back-menu">Kembali</button>
                    </div>
                    <div class="kritik-right">
                        <div class="bubbles-area" id="bubbles-container"></div>
                        <div class="pagination-controls">
                            <button id="btn-prev-page" class="game-btn pag-btn">Sebelumnya</button>
                            <span id="page-indicator">Halaman 1</span>
                            <button id="btn-next-page" class="game-btn pag-btn">Selanjutnya</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-scene">
            <div class="mountain-track">
                <div class="mountain back"></div>
                <div class="mountain"></div>
                <div class="mountain back"></div>
                <div class="mountain"></div>
            </div>

            <div class="tree-track">
                <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
                <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
                <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
                <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
            </div>

            <div class="red-car">
                <div class="car-cabin"></div>
                <div class="car-body"></div>
                <div class="car-wheel wheel-back"></div>
                <div class="car-wheel wheel-front"></div>
            </div>

            <div class="road">
                <div class="road-lines"></div>
            </div>

            <div class="game-sidebar">
                <div class="game-title">SEKOLAH MINIGAMES</div>
                <button class="game-btn" onclick="window.location.href='izursays.html'">Izur says</button>
                <button class="game-btn" disabled>Dan sisanya akan ku pikirkan.</button>
            </div>
        </div>

    </div>

    <script>
        // --- INITIALISASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDpWnZyYngAlLlzH-GkRWSM_kgfkqMqf4U",
            authDomain: "websitesdlulus.firebaseapp.com",
            projectId: "websitesdlulus",
            storageBucket: "websitesdlulus.firebasestorage.app",
            messagingSenderId: "849517691742",
            appId: "1:849517691742:web:3efed490e1d70f17c5c5cf"
        };
        
        // Cek validitas config sebelum init
        if (firebaseConfig.apiKey !== "AIzaSyDpWnZyYngAlLlzH-GkRWSM_kgfkqMqf4U") {
            firebase.initializeApp(firebaseConfig);
        } else {
            console.warn("const firebaseConfig = {
  apiKey: "AIzaSyDpWnZyYngAlLlzH-GkRWSM_kgfkqMqf4U",
  authDomain: "websitesdlulus.firebaseapp.com",
  projectId: "websitesdlulus",
  storageBucket: "websitesdlulus.firebasestorage.app",
  messagingSenderId: "849517691742",
  appId: "1:849517691742:web:3efed490e1d70f17c5c5cf",
  measurementId: "G-7JLWYWPKN3"
};");
        }
        const db = typeof firebase !== 'undefined' ? firebase.firestore() : null;

        // --- DOM SELECTORS ---
        const startNode = document.getElementById('start-node');
        const menuNode = document.getElementById('menu-node');
        const btnMinigames = document.getElementById('btn-minigames');
        const btnKenangan = document.getElementById('btn-kenangan'); 
        const btnKritik = document.getElementById('btn-kritik'); 
        const kritikPanel = document.getElementById('kritik-panel');
        const btnBackMenu = document.getElementById('btn-back-menu');
        const mainViewport = document.getElementById('main-viewport');
        const skyScene = document.getElementById('sky-scene');
        const windSfx = document.getElementById('windSfx');
        const nameInput = document.getElementById('form-nama');
        const bubblesContainer = document.getElementById('bubbles-container');
        
        let audioTracker;
        let allBubblesData = [];
        let currentPage = 0;
        const bubblesPerPage = 10;

        // --- LOGIKA AWAL MULAI ---
        startNode.addEventListener('click', () => {
            windSfx.pause(); windSfx.currentTime = 0;
            windSfx.play().then(() => {
                clearInterval(audioTracker);
                audioTracker = setInterval(() => {
                    if (windSfx.currentTime >= 3.0) {
                        windSfx.pause(); windSfx.currentTime = 0;
                        clearInterval(audioTracker);
                    }
                }, 100);
            }).catch(error => console.log("Audio terblokir:", error));

            startNode.classList.add('meledak');

            setTimeout(() => {
                startNode.classList.add('hidden');
                menuNode.classList.remove('hidden');
                menuNode.classList.add('reveal');
                
                setTimeout(() => {
                    const allBalloons = menuNode.querySelectorAll('.balloon-group');
                    allBalloons.forEach((b, idx) => {
                        b.style.animation = `ayunBalon 3s ease-in-out infinite alternate`;
                        b.style.animationDelay = `-${idx}s`;
                    });
                }, 1200);
            }, 300); 
        });

        // --- LOGIKA TRANSISI DAN PERCEPATAN AWAN/BURUNG ---
        function triggerSkyAcceleration(callback) {
            skyScene.classList.add('fast-sky');
            setTimeout(() => {
                skyScene.classList.remove('fast-sky');
                if (callback) callback();
            }, 3000);
        }

        // --- ACTION TOMBOL KRITIK & SARAN ---
        btnKritik.addEventListener('click', () => {
            // Semua balon di menu utama meledak seketika
            const allBalloons = menuNode.querySelectorAll('.balloon-group');
            allBalloons.forEach(b => b.classList.add('meledak'));

            // Memulai percepatan elemen latar selama 3 detik sebelum ganti halaman
            triggerSkyAcceleration(() => {
                menuNode.classList.add('hidden');
                kritikPanel.classList.remove('hidden');
                kritikPanel.classList.add('reveal-panel');
            });
        });

        // --- VALIDASI MAKSIMAL 5 KATA PADA INPUT NAMA ---
        nameInput.addEventListener('input', function() {
            let words = this.value.trim().split(/\s+/);
            if (this.value.trim() !== "" && words.length > 5) {
                alert("Nama maksimal terdiri dari 5 kata!");
                this.value = words.slice(0, 5).join(" ");
            }
            // Trigger render ulang real-time jika admin mengganti nama input secara live
            renderBubbles();
        });

        // --- HANDLER SUBMIT FORM & ANIMASI LOCAL BUBBLE ---
        function submitKritik(e) {
            e.preventDefault();
            const nama = nameInput.value.trim();
            const kata = document.getElementById('form-kata').value.trim();

            if (!nama || !kata) return;

            // Efek Bubble meluncur terbang dari area form pengisian
            const formRect = document.getElementById('kritik-form').getBoundingClientRect();
            const localBubble = document.createElement('div');
            localBubble.className = 'submit-bubble-effect';
            localBubble.innerText = "🎈";
            localBubble.style.left = `${formRect.left + (formRect.width / 2)}px`;
            localBubble.style.top = `${formRect.top}px`;
            document.body.appendChild(localBubble);
            setTimeout(() => localBubble.remove(), 2000);

            // Simpan ke Firebase secara Online Realtime
            if (db) {
                db.collection('kritik').add({
                    nama: nama,
                    kata: kata,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    document.getElementById('form-kata').value = "";
                }).catch(err => {
                    console.error("Gagal menyimpan ke Firebase: ", err);
                });
            } else {
                // Cadangan lokal jika Firebase tidak dipasang kredensialnya
                allBubblesData.unshift({ id: Date.now().toString(), nama, kata });
                renderBubbles();
                document.getElementById('form-kata').value = "";
            }
        }

        // --- REALTIME ONLINE SYNC LISTENER ---
        if (db) {
            db.collection('kritik').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                allBubblesData = [];
                snapshot.forEach(doc => {
                    allBubblesData.push({ id: doc.id, ...doc.data() });
                });
                renderBubbles();
            });
        }

        // --- RENDER BUBBLE DAN MODE ADMIN HAPUS ---
        function renderBubbles() {
            bubblesContainer.innerHTML = "";
            const isAdmin = (nameInput.value.trim() === ",gwAdmin");

            const startIndex = currentPage * bubblesPerPage;
            const endIndex = startIndex + bubblesPerPage;
            const currentPageData = allBubblesData.slice(startIndex, endIndex);

            currentPageData.forEach((data, index) => {
                const bubble = document.createElement('div');
                bubble.className = 'floating-bubble';
                
                // Set sebaran koordinat layout agar bubble estetik acak teratur
                bubble.style.left = `${10 + (index % 3) * 30 + Math.random() * 5}%`;
                bubble.style.top = `${10 + Math.floor(index / 3) * 26 + Math.random() * 5}%`;
                
                // Deteksi & Proteksi XSS injeksi tag HTML script
                const cleanNama = escapeHTML(data.nama);
                const cleanKata = escapeHTML(data.kata);

                bubble.innerHTML = `<strong>${cleanNama}</strong><p>${cleanKata}</p>`;

                // Fitur Khusus Admin Mode jika login menggunakan kata kunci `,gwAdmin`
                if (isAdmin) {
                    bubble.classList.add('admin-delete-mode');
                    bubble.title = "Klik untuk hapus bubble ini (Admin Only)";
                    bubble.addEventListener('click', () => {
                        if (confirm(`Hapus bubble milik "${data.nama}" secara permanen?`)) {
                            if (db) {
                                db.collection('kritik').doc(data.id).delete();
                            } else {
                                allBubblesData = allBubblesData.filter(b => b.id !== data.id);
                                renderBubbles();
                            }
                        }
                    });
                }

                bubblesContainer.appendChild(bubble);
            });

            // Update status & interaksi tombol pagination
            document.getElementById('page-indicator').innerText = `Halaman ${currentPage + 1}`;
            document.getElementById('btn-prev-page').disabled = (currentPage === 0);
            document.getElementById('btn-next-page').disabled = (endIndex >= allBubblesData.length);
        }

        // --- KONTROL NAVIGASI PAGINATION BESERTA AKSELERASI AWAN ---
        document.getElementById('btn-next-page').addEventListener('click', () => {
            triggerSkyAcceleration(() => {
                currentPage++;
                renderBubbles();
            });
        });

        document.getElementById('btn-prev-page').addEventListener('click', () => {
            triggerSkyAcceleration(() => {
                currentPage--;
                renderBubbles();
            });
        });

        // --- PARALLAX EFFECT MENGIKUTI GERAKAN LAYAR/MOUSE ---
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.03;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.03;
            
            const bubbles = document.querySelectorAll('.floating-bubble');
            bubbles.forEach((bubble, idx) => {
                const depth = (idx % 3 + 1) * 0.4; 
                bubble.style.transform = `translate(${moveX * depth}px, ${moveY * depth}px)`;
            });
        });

        // --- TOMBOL KEMBALI KE MENU UTAMA (TANPA MENGHAPUS DATA BUBBLE) ---
        btnBackMenu.addEventListener('click', () => {
            kritikPanel.classList.add('hidden');
            kritikPanel.classList.remove('reveal-panel');
            menuNode.classList.remove('hidden');
            
            // Restorasi balon agar kembali normal dari kondisi pecah
            const allBalloons = menuNode.querySelectorAll('.balloon-group');
            allBalloons.forEach(b => {
                b.classList.remove('meledak');
            });
        });

        // Helper anti-XSS injection
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // ================= ACTION UTAMA MINI GAMES (KAMERA TURUN) =================
        btnMinigames.addEventListener('click', () => {
            btnMinigames.classList.add('meledak');
            setTimeout(() => {
                mainViewport.classList.add('camera-down');
            }, 300);
        });

        // ================= ACTION UTAMA FOTO KENANGAN (KAMERA NAIK KE SPACE) =================
        btnKenangan.addEventListener('click', () => {
            btnKenangan.classList.add('meledak');
            setTimeout(() => {
                mainViewport.classList.add('space-launch');
            }, 300);
            setTimeout(() => {
                window.location.href = 'start.html';
            }, 2300);
        });
    </script>
</body>
</html>
