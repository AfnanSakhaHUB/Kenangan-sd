<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama - Izur Memories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
        }

        /* CONTAINER UTAMA (Membungkus background langit gradient 3 tingkat) */
        .main-wrapper {
            position: absolute;
            width: 100%;
            height: 300vh; /* 3x tinggi layar untuk simulasi naik ke angkasa */
            bottom: 0;
            left: 0;
            /* Gradasi dari langit awal (bawah), atmosfer (tengah), ke antariksa (atas) */
            background: linear-gradient(to top, 
                #2980b9 0%, 
                #2c3e50 35%, 
                #111726 65%, 
                #000000 100%
            );
            transition: transform 5s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        /* Efek Kamera Meluncur Naik */
        .main-wrapper.launch-to-space {
            transform: translateY(200vh);
        }

        /* LAYER BINTANG LUAR ANGKASA (Ada di bagian paling atas) */
        .starfield {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100vh;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1.5px, transparent 30px);
            background-size: 300px 300px, 200px 200px;
            opacity: 0;
            transition: opacity 3s ease;
        }

        /* Bintang muncul perlahan saat langit mulai menggelap pekat */
        .main-wrapper.launch-to-space .starfield {
            opacity: 1;
            transition-delay: 1.5s;
        }

        /* TAMPILAN HALAMAN UTAMA (Di posisi layar paling bawah) */
        .ui-screen {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px;
        }

        /* TOMBOL START UTAMA */
        .start-title-box {
            text-align: center;
            margin-top: 20px;
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(45deg, #f1c40f, #f39c12);
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        /* CONTAINER 3 BALON */
        .balloon-group {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 600px;
            margin-bottom: 50px;
        }

        /* KELAS DASAR BALON */
        .balloon {
            width: 110px;
            height: 135px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            box-shadow: inset -8px -8px 0 rgba(0,0,0,0.08), 0 10px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        /* Efek Mengambang Acak untuk Ketiga Balon */
        .balloon:nth-child(1) { background-color: #3498db; animation: float1 4s ease-in-out infinite; }
        .balloon:nth-child(2) { background-color: #e74c3c; animation: float2 3.5s ease-in-out infinite; } /* Balon Foto Kenangan */
        .balloon:nth-child(3) { background-color: #2ecc71; animation: float3 4.2s ease-in-out infinite; }

        .balloon span {
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            user-select: none;
        }

        /* Tali Balon */
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -30px;
            left: 50%;
            width: 2px;
            height: 30px;
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* Ketika Balon Foto Kenangan Di-klik, Melesat Terbang Duluan */
        .balloon.triggered-fly {
            animation: flyAwayToSky 4s forwards cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        /* ANIMASI FLOAT (MENGAMBANG) */
        @keyframes float1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
        @keyframes float3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* ANIMASI BALON TERBANG KE ATAS */
        @keyframes flyAwayToSky {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-200vh) scale(0.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper" id="mainWrapper">
        
        <div class="starfield"></div>

        <div class="ui-screen">
            
            <div class="start-title-box">
                <button class="btn-start">START</button>
            </div>

            <div class="balloon-group">
                
                <div class="balloon" id="balon-mini">
                    <span>Mini Game 🎮</span>
                </div>

                <div class="balloon" id="balon-kenangan">
                    <span>Foto-Foto Kenangan 📸</span>
                </div>

                <div class="balloon" id="balon-credits">
                    <span>Credits 🌟</span>
                </div>

            </div>

        </div>

    </div>

    <script>
        const balonKenangan = document.getElementById('balon-kenangan');
        const mainWrapper = document.getElementById('mainWrapper');

        const triggerSpaceLaunch = () => {
            // 1. Jalankan efek animasi balon melesat ke atas langit langit
            balonKenangan.classList.add('triggered-fly');
            
            // 2. Tarik layar ke atas & gelapkan atmosfer menjadi luar angkasa
            mainWrapper.classList.add('launch-to-space');

            // 3. Setelah masuk luar angkasa seutuhnya, redirect ke start.html
            setTimeout(() => {
                window.location.href = "start.html";
            }, 5000); // 5000ms = 5 detik sesuai durasi transisi CSS
        };

        // Suppport klik (Laptop) & touchstart (HP Mobile anti-delay)
        balonKenangan.addEventListener('click', triggerSpaceLaunch);
        balonKenangan.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerSpaceLaunch();
        });
    </script>
</body>
</html>
