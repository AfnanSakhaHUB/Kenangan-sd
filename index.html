<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelulusan Epik 2026</title>
    <style>
        /* --- RESET & DASAR --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #3a8ffd;
        }

        /* --- BACKGROUND LANGIT BIRU (AWAN GERAK NORMAL) --- */
        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #3a8ffd 0%, #6cb2ff 60%, #b4ecff 100%);
            z-index: 1;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 100px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.05));
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        
        .cloud1 { width: 170px; height: 60px; top: 15%; left: -200px; animation: jalanAwan 25s linear infinite; }
        .cloud1::before { width: 80px; height: 80px; top: -40px; left: 20px; }
        .cloud1::after { width: 60px; height: 60px; top: -25px; right: 20px; }

        .cloud2 { width: 230px; height: 75px; top: 35%; left: -300px; animation: jalanAwan 35s linear infinite; animation-delay: 5s; }
        .cloud2::before { width: 100px; height: 100px; top: -50px; left: 30px; }
        .cloud2::after { width: 80px; height: 80px; top: -30px; right: 30px; }

        @keyframes jalanAwan {
            0% { left: -300px; }
            100% { left: 110%; }
        }

        /* --- KONTEN UTAMA --- */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- BALON MENGGUNAKAN GAMBAR PNG KAMU --- */
        .balloon-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: ayunBalon 3s ease-in-out infinite alternate;
            cursor: pointer;
        }

        .balloon {
            width: 140px;
            height: 175px;
            /* Memasang gambar PNG kamu sebagai background balon */
            background: url('1000017857-removebg-preview.png') no-repeat center center;
            background-size: contain;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            padding: 10px;
            /* Shadow teks agar tulisan putih tetap terbaca jelas di background terang */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6), -1px -1px 3px rgba(0, 0, 0, 0.6);
            user-select: none;
            transition: transform 0.2s;
        }

        /* Tali bawah balon */
        .string {
            width: 2px;
            height: 80px;
            background: rgba(0, 0, 0, 0.15);
            margin-top: -5px; /* Narik tali sedikit ke atas agar pas di ujung gambar balon */
        }

        /* ANIMASI AYUNAN SANTAI */
        @keyframes ayunBalon {
            0% { transform: translateY(0px) rotate(-1.5deg); }
            100% { transform: translateY(-15px) rotate(1.5deg); }
        }

        .balloon-group:hover .balloon {
            transform: scale(1.06);
        }

        /* ANIMASI MELEDAK POP DI TEMPAT */
        .balloon-group.meledak {
            animation: pop 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.3); filter: brightness(1.2); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* --- LAYOUT MENU UTAMA --- */
        .menu-balloons {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* RESPONSIVE LAYOUT HP */
        @media (max-width: 600px) {
            .menu-balloons {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 15px;
            }
            .menu-balloons .balloon {
                width: 110px;
                height: 140px;
                font-size: 0.85rem;
            }
            .menu-balloons .string {
                height: 50px;
            }
        }

        /* ANIMASI TERBANG LURUS DARI BAWAH KE ATAS */
        .reveal .balloon-group {
            animation: terbangMasuk 1.2s cubic-bezier(0.075, 0.82, 0.165, 1) both;
        }
        .reveal .b-1 { animation-delay: 0s; }
        .reveal .b-2 { animation-delay: 0.15s; }
        .reveal .b-3 { animation-delay: 0.3s; }

        @keyframes terbangMasuk {
            0% { transform: translateY(800px) scale(0.6); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <audio id="windSfx" preload="auto">
        <source src="dragon-studio-wind-blowing-sfx-01-423673.mp3" type="audio/mpeg">
    </audio>

    <div class="sky">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <div class="container">
        
        <div id="start-node" class="balloon-group">
            <div class="balloon">Mulai?</div>
            <div class="string"></div>
        </div>

        <div id="menu-node" class="menu-balloons hidden">
            
            <div class="balloon-group b-1">
                <div class="balloon">Foto<br>Kenangan</div>
                <div class="string"></div>
            </div>

            <div class="balloon-group b-2">
                <div class="balloon">Catatan<br>Ranking</div>
                <div class="string"></div>
            </div>

            <div class="balloon-group b-3">
                <div class="balloon">Catatan<br>Prestasi</div>
                <div class="string"></div>
            </div>

        </div>

    </div>

    <script>
        const startNode = document.getElementById('start-node');
        const menuNode = document.getElementById('menu-node');
        const windSfx = document.getElementById('windSfx');
        
        let audioTracker;

        startNode.addEventListener('click', () => {
            // Pengaturan audio
            windSfx.pause();
            windSfx.currentTime = 0;

            windSfx.play().then(() => {
                clearInterval(audioTracker);
                audioTracker = setInterval(() => {
                    if (windSfx.currentTime >= 3.0) {
                        windSfx.pause();
                        windSfx.currentTime = 0;
                        clearInterval(audioTracker);
                    }
                }, 100);
            }).catch(error => console.log("Audio terblokir:", error));

            // 1. Memicu efek letusan pop di tempat
            startNode.classList.add('meledak');

            // 2. Transisi langsung berjalan setelah letusan selesai (0.3 detik)
            setTimeout(() => {
                startNode.classList.add('hidden');
                
                // 3. Menampilkan menu baru yang langsung meluncur terbang dari bawah ke atas
                menuNode.classList.remove('hidden');
                menuNode.classList.add('reveal');
                
                // 4. Setelah selesai meluncur naik, aktifkan goyangan lembutnya secara otomatis
                setTimeout(() => {
                    const allBalloons = menuNode.querySelectorAll('.balloon-group');
                    allBalloons.forEach((b, idx) => {
                        b.style.animation = `ayunBalon 3s ease-in-out infinite alternate`;
                        b.style.animationDelay = `-${idx}s`;
                    });
                }, 1200);

            }, 300); 
        });
    </script>
</body>
</html>
