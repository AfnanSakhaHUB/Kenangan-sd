<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelulusan Premium 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Efek Gelombang Kejut Saat Meledak -->
    <div class="shockwave" id="shockwave"></div>

    <!-- Wrapper Utama untuk Efek Guncangan Layar (Screen Shake) -->
    <div class="shake-container" id="screen">
        
        <!-- BACKGROUND: Langit Atmosferik -->
        <div class="sky" id="skyBg">
            <div class="aurora"></div>
            <div class="mist m1"></div>
            <div class="mist m2"></div>
        </div>

        <!-- KONTEN -->
        <div class="container">
            
            <!-- TAHAP 1: Balon Inti "Mulai" (Gaya Kaca Neon) -->
            <div id="balloon-start" class="orb-wrapper">
                <div class="main-orb">
                    <div class="pulse-glow"></div>
                    <div class="orb-text">Mulai 🎓</div>
                </div>
                <div class="energy-line"></div>
            </div>

            <!-- TAHAP 2: 3 Pod Pilihan Premium (Awalnya Tersembunyi) -->
            <div id="balloon-choices" class="menu-container hidden">
                
                <div class="card-pod pod-blue">
                    <div class="icon">📸</div>
                    <h3>Foto Kenangan</h3>
                    <p>Memori Indah</p>
                </div>

                <div class="card-pod pod-green">
                    <div class="icon">🏆</div>
                    <h3>Catatan Ranking</h3>
                    <p>Peringkat & Nilai</p>
                </div>

                <div class="card-pod pod-gold">
                    <div class="icon">📜</div>
                    <h3>Catatan Prestasi</h3>
                    <p>Penghargaan Epik</p>
                </div>

            </div>

        </div>
    </div>

    <script>
        const startBalloon = document.getElementById('balloon-start');
        const screen = document.getElementById('screen');
        const skyBg = document.getElementById('skyBg');
        const shockwave = document.getElementById('shockwave');
        const choicesContainer = document.getElementById('balloon-choices');

        startBalloon.addEventListener('click', (e) => {
            // 1. Dapatkan posisi klik untuk pusat gelombang kejut
            const rect = startBalloon.getBoundingClientRect();
            shockwave.style.left = (rect.left + rect.width / 2) + 'px';
            shockwave.style.top = (rect.top + rect.height / 2) + 'px';
            
            // 2. Aktifkan Efek Ledakan, Guncangan, dan Shockwave
            startBalloon.classList.add('implode');
            screen.classList.add('action-shake');
            shockwave.classList.add('wave-blast');
            skyBg.classList.add('hyper-drive');

            // 3. Durasi Transisi Sinematik
            setTimeout(() => {
                startBalloon.classList.add('hidden');
                screen.classList.remove('action-shake');
                skyBg.classList.remove('hyper-drive');
                shockwave.classList.remove('wave-blast');
                
                // 4. Munculkan Menu Pilihan dengan Animasi Masuk yang Halus
                choicesContainer.classList.remove('hidden');
                choicesContainer.classList.add('reveal-menu');
            }, 1000);
        });
    </script>
</body>
</html>
