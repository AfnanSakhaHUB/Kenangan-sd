<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelulusan Epik 2026</title>
    <style>
        /* --- RESET & DASAR --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #3a8ffd;
        }

        /* --- BACKGROUND LANGIT BIRU INDAH --- */
        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #3a8ffd 0%, #6cb2ff 60%, #b4ecff 100%);
            z-index: 1;
            overflow: hidden;
            transition: all 0.8s ease;
        }

        /* Desain Awan Minimalis Fluffy */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 100px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.05));
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        
        .cloud1 { width: 170px; height: 60px; top: 15%; left: -200px; animation: jalanAwan 25s linear infinite; }
        .cloud1::before { width: 80px; height: 80px; top: -40px; left: 20px; }
        .cloud1::after { width: 60px; height: 60px; top: -25px; right: 20px; }

        .cloud2 { width: 230px; height: 75px; top: 35%; left: -300px; animation: jalanAwan 35s linear infinite; animation-delay: 5s; }
        .cloud2::before { width: 100px; height: 100px; top: -50px; left: 30px; }
        .cloud2::after { width: 80px; height: 80px; top: -30px; right: 30px; }

        @keyframes jalanAwan {
            0% { left: -300px; }
            100% { left: 110%; }
        }

        /* TRANSISI AWAN CEPAT (WARP EFFECT) */
        .sky.cepat .cloud {
            animation-duration: 0.5s !important;
            transform: scaleX(4) skewX(-10deg);
            opacity: 0.7;
            filter: blur(2px);
        }

        /* --- KONTEN UTAMA --- */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- ANIMASI AMBIENT MELAYANG --- */
        .balloon-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: ayunBalon 3s ease-in-out infinite alternate;
            cursor: pointer;
        }

        /* Wadah Balon Gambar */
        .balloon-container {
            position: relative;
            width: 150px;
            transition: transform 0.2s;
            user-select: none;
        }

        /* Mengatur Gambar Balon Berfungsi Baik */
        .balloon-img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        /* Penempatan Teks di Tengah Kepala Balon */
        .balloon-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            width: 85%;
            /* Bayangan teks agar tulisan tetap terbaca jelas apa pun warna balonnya */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), -2px -2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            line-height: 1.3;
        }

        @keyframes ayunBalon {
            0% { transform: translateY(0px) rotate(-1.3deg); }
            100% { transform: translateY(-18px) rotate(1.3deg); }
        }

        .balloon-group:hover .balloon-container {
            transform: scale(1.08);
        }

        /* ANIMASI MELEDAK */
        .balloon-group.meledak {
            animation: pop 0.2s forwards ease-out;
            pointer-events: none;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); filter: brightness(1.4); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* --- LAYOUT 3 BALON MENU (RESPONSIF PONSEL) --- */
        .menu-balloons {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .menu-balloons .b-1 { animation-delay: 0s; }
        .menu-balloons .b-2 { animation-delay: -1s; }
        .menu-balloons .b-3 { animation-delay: -2s; }

        /* Tampilan khusus Layar HP */
        @media (max-width: 600px) {
            .menu-balloons {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
            }
            .balloon-container {
                width: 110px;
            }
            .balloon-text {
                font-size: 0.85rem;
                top: 38%;
            }
        }

        /* Animasi Balon Terbang Masuk dari Bawah */
        .reveal .balloon-group {
            animation: terbangMasuk 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        .reveal .b-1 { animation-delay: 0s; }
        .reveal .b-2 { animation-delay: 0.2s; }
        .reveal .b-3 { animation-delay: 0.4s; }

        @keyframes terbangMasuk {
            0% { transform: translateY(700px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="sky" id="skyBg">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <div class="container">
        
        <div id="start-node" class="balloon-group">
            <div class="balloon-container">
                <img src="1000017857-removebg-preview.png" alt="Balon" class="balloon-img">
                <div class="balloon-text">Mulai? 🎈</div>
            </div>
        </div>

        <div id="menu-node" class="menu-balloons hidden">
            
            <div class="balloon-group b-1">
                <div class="balloon-container">
                    <img src="1000017857-removebg-preview.png" alt="Balon" class="balloon-img">
                    <div class="balloon-text">Foto<br>Kenangan 📸</div>
                </div>
            </div>

            <div class="balloon-group b-2">
                <div class="balloon-container">
                    <img src="1000017857-removebg-preview.png" alt="Balon" class="balloon-img">
                    <div class="balloon-text">Catatan<br>Ranking 🏆</div>
                </div>
            </div>

            <div class="balloon-group b-3">
                <div class="balloon-container">
                    <img src="1000017857-removebg-preview.png" alt="Balon" class="balloon-img">
                    <div class="balloon-text">Catatan<br>Prestasi 📜</div>
                </div>
            </div>

        </div>

    </div>

    <script>
        const startNode = document.getElementById('start-node');
        const menuNode = document.getElementById('menu-node');
        const skyBg = document.getElementById('skyBg');

        // Menyiapkan audio efek angin transisi
        const sfxWind = new Audio('dragon-studio-wind-blowing-sfx-01-423673.mp3');

        startNode.addEventListener('click', () => {
            // 1. Putar musik SFX Angin secara instan
            sfxWind.play().catch(err => console.log("Audio dimainkan setelah interaksi user:", err));

            // 2. Memicu animasi meledak pada balon merah
            startNode.classList.add('meledak');
            
            // 3. Memicu efek awan bergerak super kencang
            skyBg.classList.add('cepat');

            // 4. Durasi jeda sinematik selama 1.2 detik
            setTimeout(() => {
                startNode.classList.add('hidden');
                skyBg.classList.remove('cepat');
                
                // 5. Memunculkan 3 pilihan menu baru terbang dari bawah
                menuNode.classList.remove('hidden');
                menuNode.classList.add('reveal');
                
                // Mengembalikan kontrol ayunan melayang normal setelah animasi masuk selesai
                setTimeout(() => {
                    const allBalloons = menuNode.querySelectorAll('.balloon-group');
                    allBalloons.forEach((b, idx) => {
                        b.style.animation = `ayunBalon 3s ease-in-out infinite alternate`;
                        b.style.animationDelay = `-${idx}s`;
                    });
                }, 1200);

            }, 1200);
        });
    </script>
</body>
</html>
