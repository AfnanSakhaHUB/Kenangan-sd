<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelulusan Epik 2026</title>
    <style>
        /* --- RESET & DASAR --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #3a8ffd;
        }

        /* --- BACKGROUND LANGIT BIRU --- */
        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #3a8ffd 0%, #6cb2ff 60%, #b4ecff 100%);
            z-index: 1;
            overflow: hidden;
        }

        /* --- EFEK MATAHARI CERAH REAF --- */
        .sun {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 100px;
            height: 100px;
            background: #ffdd1a;
            border-radius: 50%;
            /* Efek cahaya kuning cerah melingkar */
            box-shadow: 0 0 40px #ffea4a, 0 0 80px #ffea4a, 0 0 120px #ffea4a;
            animation: pendarMatahari 4s ease-in-out infinite alternate;
        }

        @keyframes pendarMatahari {
            0% { transform: scale(1); box-shadow: 0 0 40px #ffea4a, 0 0 80px #ffea4a; }
            100% { transform: scale(1.05); box-shadow: 0 0 60px #ffea4a, 0 0 110px #ffea4a, 0 0 150px #ffea4a; }
        }

        /* --- BURUNG TERBANG (200w.webp) --- */
        .bird {
            position: absolute;
            background: url('200w.webp') no-repeat center center;
            background-size: contain;
            pointer-events: none;
        }

        .bird1 {
            width: 70px;
            height: 70px;
            top: 20%;
            left: -100px;
            animation: terbangBurung 14s linear infinite;
        }

        .bird2 {
            width: 50px; /* Lebih kecil biar ada efek jarak (artifisial depth) */
            height: 50px;
            top: 12%;
            left: -100px;
            animation: terbangBurung 18s linear infinite;
            animation-delay: 5s; /* Biar lewatnya bergantian */
        }

        @keyframes terbangBurung {
            0% { left: -100px; transform: translateY(0); }
            50% { transform: translateY(-15px); } /* Efek agak naik turun pas terbang */
            100% { left: 110%; transform: translateY(0); }
        }

        /* --- AWAN GERAK --- */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 100px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.05));
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        
        .cloud1 { width: 170px; height: 60px; top: 25%; left: -200px; animation: jalanAwan 25s linear infinite; }
        .cloud1::before { width: 80px; height: 80px; top: -40px; left: 20px; }
        .cloud1::after { width: 60px; height: 60px; top: -25px; right: 20px; }

        .cloud2 { width: 230px; height: 75px; top: 45%; left: -300px; animation: jalanAwan 35s linear infinite; animation-delay: 3s; }
        .cloud2::before { width: 100px; height: 100px; top: -50px; left: 30px; }
        .cloud2::after { width: 80px; height: 80px; top: -30px; right: 30px; }

        @keyframes jalanAwan {
            0% { left: -300px; }
            100% { left: 110%; }
        }

        /* --- KONTEN UTAMA --- */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- STYLE BALON GAMBAR PNG --- */
        .balloon-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: ayunBalon 3s ease-in-out infinite alternate;
            cursor: pointer;
        }

        .balloon {
            position: relative;
            width: 160px; 
            height: 210px;
            background: url('1000017857-removebg-preview.png') no-repeat center center;
            background-size: contain;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Teks melayang di tengah perut balon */
        .balloon-text {
            position: absolute;
            top: 40%; 
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            width: 80%;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), -2px -2px 4px rgba(0, 0, 0, 0.8);
            z-index: 5;
            pointer-events: none;
        }

        /* ANIMASI AYUNAN BALON */
        @keyframes ayunBalon {
            0% { transform: translateY(0px) rotate(-1.5deg); }
            100% { transform: translateY(-15px) rotate(1.5deg); }
        }

        .balloon-group:hover {
            transform: scale(1.06);
            transition: transform 0.2s;
        }

        /* ANIMASI MELEDAK POP */
        .balloon-group.meledak {
            animation: pop 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.2); filter: brightness(1.2); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* --- LAYOUT MENU UTAMA --- */
        .menu-balloons {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* RESPONSIVE LAYOUT HP */
        @media (max-width: 600px) {
            .menu-balloons {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 20px;
            }
            .balloon {
                width: 120px;
                height: 160px;
            }
            .balloon-text {
                font-size: 0.9rem;
            }
            .sun {
                width: 70px;
                height: 70px;
                top: 20px;
                right: 20px;
            }
        }

        /* ANIMASI TERBANG MASUK */
        .reveal .balloon-group {
            animation: terbangMasuk 1.2s cubic-bezier(0.075, 0.82, 0.165, 1) both;
        }
        .reveal .b-1 { animation-delay: 0s; }
        .reveal .b-2 { animation-delay: 0.15s; }
        .reveal .b-3 { animation-delay: 0.3s; }

        @keyframes terbangMasuk {
            0% { transform: translateY(800px) scale(0.6); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <audio id="windSfx" preload="auto">
        <source src="dragon-studio-wind-blowing-sfx-01-423673.mp3" type="audio/mpeg">
    </audio>

    <div class="sky">
        <div class="sun"></div>
        <div class="bird bird1"></div>
        <div class="bird bird2"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <div class="container">
        
        <div id="start-node" class="balloon-group">
            <div class="balloon">
                <div class="balloon-text">Mulai?</div>
            </div>
        </div>

        <div id="menu-node" class="menu-balloons hidden">
            
            <div class="balloon-group b-1">
                <div class="balloon">
                    <div class="balloon-text">Foto<br>Kenangan</div>
                </div>
            </div>

            <div class="balloon-group b-2">
                <div class="balloon">
                    <div class="balloon-text">Catatan<br>Ranking</div>
                </div>
            </div>

            <div class="balloon-group b-3">
                <div class="balloon">
                    <div class="balloon-text">Catatan<br>Prestasi</div>
                </div>
            </div>

        </div>

    </div>

    <script>
        const startNode = document.getElementById('start-node');
        const menuNode = document.getElementById('menu-node');
        const windSfx = document.getElementById('windSfx');
        
        let audioTracker;

        startNode.addEventListener('click', () => {
            windSfx.pause();
            windSfx.currentTime = 0;

            windSfx.play().then(() => {
                clearInterval(audioTracker);
                audioTracker = setInterval(() => {
                    if (windSfx.currentTime >= 3.0) {
                        windSfx.pause();
                        windSfx.currentTime = 0;
                        clearInterval(audioTracker);
                    }
                }, 100);
            }).catch(error => console.log("Audio terblokir:", error));

            startNode.classList.add('meledak');

            setTimeout(() => {
                startNode.classList.add('hidden');
                menuNode.classList.remove('hidden');
                menuNode.classList.add('reveal');
                
                setTimeout(() => {
                    const allBalloons = menuNode.querySelectorAll('.balloon-group');
                    allBalloons.forEach((b, idx) => {
                        b.style.animation = `ayunBalon 3s ease-in-out infinite alternate`;
                        b.style.animationDelay = `-${idx}s`;
                    });
                }, 1200);

            }, 300); 
        });
    </script>
</body>
</html>
