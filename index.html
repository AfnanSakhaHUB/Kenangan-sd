<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenangan - Perjalanan Luar Angkasa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* CONTAINER UTAMA (Membungkus seluruh tingkat langit) */
        .space-container {
            position: absolute;
            width: 100%;
            height: 300vh; /* 3x tinggi layar untuk efek naik */
            bottom: 0;
            left: 0;
            /* Transisi langit dari bawah (siang/sore) ke atas (luar angkasa pekat) */
            background: linear-gradient(to top, 
                #f1c40f 0%, 
                #e67e22 20%, 
                #2c3e50 50%, 
                #1a1a2e 75%, 
                #000000 100%
            );
            transition: transform 5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Trigger saat kamera bergerak naik ke angkasa */
        .space-container.launching {
            transform: translateY(200vh);
        }

        /* AREA GROUND / START (Tampilan awal di layar bawah) */
        .ground-scene {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* BALON FOTO KENANGAN */
        .memory-balloon {
            width: 140px;
            height: 165px;
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: floatAnimation 4s ease-in-out infinite;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        /* Tulisan di dalam balon */
        .memory-balloon span {
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
            user-select: none;
        }

        /* Tali Balon */
        .memory-balloon::after {
            content: "";
            position: absolute;
            bottom: -40px;
            left: 50%;
            width: 2px;
            height: 40px;
            background: linear-gradient(to bottom, #ffffff, rgba(255,255,255,0.2));
        }

        /* Animasi balon melesat ke atas langit */
        .memory-balloon.fly-away {
            animation: flyToSpace 5s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* LAYER BINTANG (Hanya muncul di paling atas / luar angkasa) */
        .star-layer {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 50%, white 1px, transparent 2px),
                radial-gradient(circle at 20% 30%, white 1.5px, transparent 3px),
                radial-gradient(circle at 80% 70%, white 1px, transparent 2px);
            background-size: 200px 200px, 300px 300px, 150px 150px;
            opacity: 0;
            transition: opacity 3.5s ease;
        }

        /* Bintang muncul perlahan saat langit menggelap */
        .space-container.launching .star-layer {
            opacity: 1;
            transition-delay: 2s;
        }

        /* ANIMASI */
        @keyframes floatAnimation {
            0% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(-1deg); }
        }

        @keyframes flyToSpace {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-200vh) scale(0.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- CONTAINER LANGIT LUAR ANGKASA -->
    <div class="space-container" id="spaceContainer">
        
        <!-- Lapisan Luar Angkasa (Paling Atas) -->
        <div class="star-layer"></div>

        <!-- Lapisan Awal (Paling Bawah) -->
        <div class="ground-scene">
            
            <!-- Balon Foto Kenangan milikmu -->
            <div class="memory-balloon" id="btnKenangan">
                <span>Foto-Foto Kenangan 🎈</span>
            </div>

        </div>

    </div>

    <script>
        const btnKenangan = document.getElementById('btnKenangan');
        const spaceContainer = document.getElementById('spaceContainer');

        const startLaunch = () => {
            // Memicu efek balon terbang dan layar bergulir ke atas (langit menggelap)
            btnKenangan.classList.add('fly-away');
            spaceContainer.classList.add('launching');

            // Setelah masuk luar angkasa, pindah ke start.html
            setTimeout(() => {
                window.location.href = "start.html";
            }, 5000); // 5 detik disesuaikan dengan durasi transisi CSS
        };

        // Mendukung klik mouse dan sentuhan layar HP
        btnKenangan.addEventListener('click', startLaunch);
        btnKenangan.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startLaunch();
        });
    </script>
</body>
</html>
