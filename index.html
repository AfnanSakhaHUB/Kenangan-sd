<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perjalanan ke Luar Angkasa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* DUNIA/LANGIT (Tinggi ke atas untuk efek scrolling) */
        .world {
            position: absolute;
            width: 100%;
            height: 300vh; /* 3 kali tinggi layar */
            bottom: 0;
            left: 0;
            /* Gradient dari langit siang (bawah), atmosfer (tengah), ke luar angkasa (atas) */
            background: linear-gradient(to top, #74b9ff 0%, #0984e3 40%, #2d3436 70%, #000000 100%);
            transition: transform 4s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        /* Efek Kamera Naik: Menggeser seluruh dunia ke bawah */
        .world.move-up {
            transform: translateY(200vh);
        }

        /* AREA PEMAIN (Di bagian paling bawah/langit siang) */
        .ground-level {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* BINTANG-BINTANG (Hanya muncul saat sudah di luar angkasa / atas) */
        .stars {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100vh;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 20px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0;
            transition: opacity 3s ease;
        }

        .world.move-up .stars {
            opacity: 1;
            transition-delay: 2s; /* Muncul perlahan setelah langit menggelap */
        }

        /* BALON */
        .balloon {
            width: 100px;
            height: 120px;
            background-color: #ff7675;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            position: relative;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.07);
            animation: float 3s ease-in-out infinite;
            transition: transform 0.2s;
        }

        .balloon:active {
            transform: scale(0.9);
        }

        /* Tali Balon */
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -30px;
            left: 50%;
            width: 2px;
            height: 30px;
            background-color: #2d3436;
        }

        /* Efek Balon Terbang Cepat saat disentuh */
        .balloon.fly-away {
            animation: flyUp 4s forwards cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        /* PETUNJUK */
        .instruction {
            color: white;
            margin-top: 50px;
            font-size: 1.2rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            pointer-events: none;
            animation: pulse 1.5s infinite alternate;
        }

        /* ANIMASI-ANIMASI */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes flyUp {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-200vh) scale(0.5); opacity: 0.5; }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- DUNIA GAME -->
    <div class="world" id="gameWorld">
        
        <!-- Lapisan Bintang di Luar Angkasa (Paling Atas) -->
        <div class="stars"></div>

        <!-- Area Awal Pemain (Paling Bawah) -->
        <div class="ground-level">
            <div class="balloon" id="playerBalloon"></div>
            <div class="instruction">Sentuh Balon untuk Terbang</div>
        </div>

    </div>

    <script>
        const balloon = document.getElementById('playerBalloon');
        const world = document.getElementById('gameWorld');

        // Mendeteksi event sentuh (Touch untuk HP, Click untuk Laptop)
        const triggerTransition = () => {
            // 1. Tambahkan kelas animasi ke balon dan dunia
            balloon.classList.add('fly-away');
            world.classList.add('move-up');

            // 2. Tunggu animasi selesai (4 detik / 4000ms), lalu pindah halaman
            setTimeout(() => {
                window.location.href = "start.html";
            }, 4300); // Diberi jeda sedikit agar transisi luar angkasa terlihat penuh dulu
        };

        balloon.addEventListener('click', triggerTransition);
        balloon.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Mencegah double-click pada perangkat mobile
            triggerTransition();
        });
    </script>
</body>
</html>
