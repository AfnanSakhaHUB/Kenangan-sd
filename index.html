<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelulusan Epik 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main-viewport">

        <div id="space-scene">
            <div class="space-stars"></div>
        </div>

        <div id="sky-scene">
            <audio id="windSfx" preload="auto">
                <source src="dragon-studio-wind-blowing-sfx-01-423673.mp3" type="audio/mpeg">
            </audio>

            <div class="sky">
                <div class="sun"></div>
                <div class="bird bird1"></div>
                <div class="bird bird2"></div>
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
            </div>

            <div class="container">
                <div id="start-node" class="balloon-group">
                    <div class="balloon">
                        <div class="balloon-text">Mulai?</div>
                    </div>
                </div>

                <div id="menu-node" class="menu-balloons hidden">
                    <div id="btn-kenangan" class="balloon-group b-1">
                        <div class="balloon"><div class="balloon-text">Foto<br>Kenangan</div></div>
                    </div>
                    <div id="btn-kritik" class="balloon-group b-2">
                        <div class="balloon"><div class="balloon-text">Kritik &<br>Saran</div></div>
                    </div>
                    <div id="btn-minigames" class="balloon-group b-3">
                        <div class="balloon"><div class="balloon-text">Mini games</div></div>
                    </div>
                </div>
            </div>

            <div id="kritik-scene" class="hidden">
                <button id="btn-back-main" class="back-btn">← Kembali</button>
                
                <div class="kritik-container">
                    <div class="kritik-form-box">
                        <h2 class="form-title">Tuliskan Nama dan Kata-kata</h2>
                        <form id="form-kritik">
                            <div class="input-group">
                                <label for="input-nama">Nama</label>
                                <input type="text" id="input-nama" placeholder="Ketik nama atau panggilan..." required autocomplete="off">
                                <small class="hint">Maksimal 5 kata</small>
                            </div>
                            <div class="input-group">
                                <label for="input-kata">Kata-kata</label>
                                <textarea id="input-kata" rows="5" placeholder="Berikan kritik, saran, atau pesan berkesanmu..." required></textarea>
                                <small class="hint"><span id="char-count">0</span>/500 karakter</small>
                            </div>
                            <button type="submit" id="btn-submit-kritik" class="submit-btn">Kirim Bubble 🎈</button>
                        </form>
                    </div>

                    <div class="kritik-display-box">
                        <div id="bubbles-viewport">
                            <div id="bubbles-container"></div>
                        </div>
                        <div class="pagination-controls">
                            <button id="btn-prev-page" class="nav-btn hidden">← Prev Page</button>
                            <button id="btn-next-page" class="nav-btn hidden">Next Page →</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-scene">
            <div class="mountain-track">
                <div class="mountain back"></div>
                <div class="mountain"></div>
                <div class="mountain back"></div>
                <div class="mountain"></div>
            </div>

            <div class="tree-track">
                <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
                <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
                <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
                <div class="tree"><div class="tree-leaves"></div><div class="tree-trunk"></div></div>
            </div>

            <div class="red-car">
                <div class="car-cabin"></div>
                <div class="car-body"></div>
                <div class="car-wheel wheel-back"></div>
                <div class="car-wheel wheel-front"></div>
            </div>

            <div class="road">
                <div class="road-lines"></div>
            </div>

            <div class="game-sidebar">
                <div class="game-title">SEKOLAH MINIGAMES</div>
                <button class="game-btn" onclick="window.location.href='izursays.html'">Izur says</button>
                <button class="game-btn" disabled>Dan sisanya akan ku pikirkan.</button>
            </div>
        </div>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
