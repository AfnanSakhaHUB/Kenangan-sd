<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelulusan Epik 2026</title>
    <style>
        /* --- RESET & DASAR --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #3a8ffd;
        }

        /* --- BACKGROUND LANGIT BIRU INDAH --- */
        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #3a8ffd 0%, #6cb2ff 60%, #b4ecff 100%);
            z-index: 1;
            overflow: hidden;
            transition: all 0.8s ease;
        }

        /* Awan Bergerak */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 100px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.05));
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        
        .cloud1 { width: 170px; height: 60px; top: 15%; left: -200px; animation: jalanAwan 25s linear infinite; }
        .cloud1::before { width: 80px; height: 80px; top: -40px; left: 20px; }
        .cloud1::after { width: 60px; height: 60px; top: -25px; right: 20px; }

        .cloud2 { width: 230px; height: 75px; top: 35%; left: -300px; animation: jalanAwan 35s linear infinite; animation-delay: 5s; }
        .cloud2::before { width: 100px; height: 100px; top: -50px; left: 30px; }
        .cloud2::after { width: 80px; height: 80px; top: -30px; right: 30px; }

        @keyframes jalanAwan {
            0% { left: -300px; }
            100% { left: 110%; }
        }

        .sky.cepat .cloud {
            animation-duration: 0.5s !important;
            transform: scaleX(4) skewX(-10deg);
            opacity: 0.7;
            filter: blur(2px);
        }

        /* --- KONTEN UTAMA --- */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- BALON 3D GLOSSY NYATA --- */
        .balloon-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: ayunBalon 3s ease-in-out infinite alternate;
            cursor: pointer;
        }

        .balloon {
            width: 140px;
            height: 175px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            padding: 10px;
            /* Efek Bayangan Kedalaman (3D Sphere) */
            box-shadow: inset -12px -20px 30px rgba(0,0,0,0.4), 
                        inset 10px 10px 20px rgba(255,255,255,0.2),
                        0 12px 24px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            user-select: none;
        }

        /* PANTULAN CAHAYA UTAMA (Glossy Highlight Atas) */
        .balloon::before {
            content: '';
            position: absolute;
            top: 6%; left: 15%;
            width: 35px; height: 55px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.65), rgba(255,255,255,0));
            border-radius: 50% 50% 40% 40%;
            transform: rotate(-25deg);
        }

        /* PANTULAN CAHAYA SEKUNDER (Pantulan Lembut Bawah/Samping) */
        .balloon::after {
            content: "";
            position: absolute;
            bottom: 12px;
            right: 15%;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            filter: blur(1px);
        }

        /* Simpul Tali Balon */
        .knot {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            position: relative;
            z-index: 2;
            margin-top: -1px;
        }

        /* Tali Balon */
        .string {
            width: 2px;
            height: 80px;
            background: rgba(0, 0, 0, 0.15);
        }

        /* KATEGORI WARNA GRADASI BALON */
        .red { background: radial-gradient(circle at 35% 35%, #ff5252 0%, #cc0000 80%); }
        .red + .knot { border-bottom: 12px solid #cc0000; }

        .blue { background: radial-gradient(circle at 35% 35%, #4fc3f7 0%, #1565c0 80%); }
        .blue + .knot { border-bottom: 12px solid #1565c0; }

        .green { background: radial-gradient(circle at 35% 35%, #66bb6a 0%, #2e7d32 80%); }
        .green + .knot { border-bottom: 12px solid #2e7d32; }

        .yellow { background: radial-gradient(circle at 35% 35%, #ffca28 0%, #f57f17 80%); }
        .yellow + .knot { border-bottom: 12px solid #f57f17; }

        /* ANIMASI MELAYANG */
        @keyframes ayunBalon {
            0% { transform: translateY(0px) rotate(-1.5deg); }
            100% { transform: translateY(-15px) rotate(1.5deg); }
        }

        .balloon-group:hover .balloon {
            transform: scale(1.06);
        }

        /* ANIMASI MELEDAK */
        .balloon-group.meledak {
            animation: pop 0.2s forwards ease-out;
            pointer-events: none;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); filter: brightness(1.4); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* --- LAYOUT 3 BALON MENU --- */
        .menu-balloons {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .menu-balloons .b-1 { animation-delay: 0s; }
        .menu-balloons .b-2 { animation-delay: -1s; }
        .menu-balloons .b-3 { animation-delay: -2s; }

        /* Responsif HP */
        @media (max-width: 600px) {
            .menu-balloons {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 15px;
            }
            .menu-balloons .balloon {
                width: 105px;
                height: 135px;
                font-size: 0.85rem;
            }
            .menu-balloons .string {
                height: 50px;
            }
        }

        /* Animasi Balon Terbang Masuk */
        .reveal .balloon-group {
            animation: terbangMasuk 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        .reveal .b-1 { animation-delay: 0s; }
        .reveal .b-2 { animation-delay: 0.2s; }
        .reveal .b-3 { animation-delay: 0.4s; }

        @keyframes terbangMasuk {
            0% { transform: translateY(700px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <audio id="windSfx" preload="auto">
        <source src="dragon-studio-wind-blowing-sfx-01-423673.mp3" type="audio/mpeg">
    </audio>

    <div class="sky" id="skyBg">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <div class="container">
        
        <div id="start-node" class="balloon-group">
            <div class="balloon red">Mulai? 🎈</div>
            <div class="knot"></div>
            <div class="string"></div>
        </div>

        <div id="menu-node" class="menu-balloons hidden">
            
            <div class="balloon-group b-1">
                <div class="balloon blue">Foto<br>Kenangan 📸</div>
                <div class="knot"></div>
                <div class="string"></div>
            </div>

            <div class="balloon-group b-2">
                <div class="balloon green">Catatan<br>Ranking 🏆</div>
                <div class="knot"></div>
                <div class="string"></div>
            </div>

            <div class="balloon-group b-3">
                <div class="balloon yellow">Catatan<br>Prestasi 📜</div>
                <div class="knot"></div>
                <div class="string"></div>
            </div>

        </div>

    </div>

    <script>
        const startNode = document.getElementById('start-node');
        const menuNode = document.getElementById('menu-node');
        const skyBg = document.getElementById('skyBg');
        const windSfx = document.getElementById('windSfx');

        startNode.addEventListener('click', () => {
            // Memaksa audio diputar ulang dari detik ke-0 (mengatasi bug delay mobile browser)
            windSfx.currentTime = 0;
            windSfx.play().catch(error => {
                console.log("Audio diblokir browser, butuh interaksi fisik:", error);
            });

            startNode.classList.add('meledak');
            skyBg.classList.add('cepat');

            setTimeout(() => {
                startNode.classList.add('hidden');
                skyBg.classList.remove('cepat');
                
                menuNode.classList.remove('hidden');
                menuNode.classList.add('reveal');
                
                setTimeout(() => {
                    const allBalloons = menuNode.querySelectorAll('.balloon-group');
                    allBalloons.forEach((b, idx) => {
                        b.style.animation = `ayunBalon 3s ease-in-out infinite alternate`;
                        b.style.animationDelay = `-${idx}s`;
                    });
                }, 1200);

            }, 1200);
        });
    </script>
</body>
</html>
