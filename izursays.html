<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Izur Says - Edisi Spesial Perpisahan</title>
    <link rel="stylesheet" href="izursays.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@500;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="epic-bg-glow"></div>

    <div id="game-container">
        
        <!-- HEADER DIALOG IZUR -->
        <div id="izur-header">
            <div id="izur-avatar-container">
                <div id="izur-avatar">😎</div>
                <div class="avatar-pulse"></div>
            </div>
            <div id="izur-bubble">
                <div id="izur-title">IZUR SAYS ENGINE</div>
                <span id="izur-command">MENUNGGU KOMANDO...</span>
                <div id="timer-bar"><div id="timer-progress"></div></div>
            </div>
        </div>

        <!-- PANEL SKOR -->
        <div id="ui-panel">
            <button id="btn-back" onclick="window.location.href='index.html'">⬅ KELUAR</button>
            <div id="score-box">
                <span class="label">SCORE</span>
                <span id="current-score">000</span>
            </div>
        </div>

        <!-- AREA CANVAS GAME -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>

        <!-- VIRTUAL CONTROLLER FOR MOBILE (Hanya muncul di HP) -->
        <div id="mobile-controller">
            <div class="dpad-row">
                <button class="dpad-btn btn-up" id="pad-up">▲</button>
            </div>
            <div class="dpad-row">
                <button class="dpad-btn btn-left" id="pad-left">◀</button>
                <div class="dpad-center"></div>
                <button class="dpad-btn btn-right" id="pad-right">▶</button>
            </div>
            <div class="dpad-row">
                <button class="dpad-btn btn-down" id="pad-down">▼</button>
            </div>
        </div>

        <!-- MODAL: INPUT NAMA AWAL -->
        <div id="overlay-modal" class="modal">
            <div class="modal-content animate-pop">
                <div class="event-tag">MEMORIES OF 2026</div>
                <h2>IZUR SAYS</h2>
                <p class="subtext">Edisi Spesial Perpisahan Sekolah. Buktikan lu gak gampang dikacangin!</p>
                
                <div class="input-group">
                    <label for="player-name-input">INPUT NAMA KAMU</label>
                    <input type="text" id="player-name-input" placeholder="Ketik nama di sini..." maxlength="12">
                </div>
                
                <button id="btn-start-game" class="menu-btn gold-glow">MULAI PERMAINAN</button>
            </div>
        </div>

        <!-- MODAL: GAME OVER & LEADERBOARD -->
        <div id="gameover-modal" class="modal hidden">
            <div class="modal-content animate-pop">
                <div class="eliminated-tag">ELIMINASI</div>
                <h1 class="text-danger">LU DIKACANGI!</h1>
                <p class="score-summary">Total Skor Akhir: <span id="final-score">0</span></p>
                
                <div class="leaderboard-box">
                    <h3>🏆 PAPAN PERINGKAT TERATAS 🏆</h3>
                    <div id="leaderboard-list"></div>
                </div>

                <div class="modal-actions">
                    <button id="btn-restart" class="menu-btn gold-glow">MAIN LAGI</button>
                    <button class="menu-btn btn-secondary" onclick="window.location.href='index.html'">BALIK KE MENU UTAMA</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const izurCommandText = document.getElementById('izur-command');
        const timerProgress = document.getElementById('timer-progress');
        const currentScoreText = document.getElementById('current-score');
        const finalScoreText = document.getElementById('final-score');
        const overlayModal = document.getElementById('overlay-modal');
        const gameoverModal = document.getElementById('gameover-modal');
        const nameInput = document.getElementById('player-name-input');
        const btnStart = document.getElementById('btn-start-game');
        const btnRestart = document.getElementById('btn-restart');
        const leaderboardList = document.getElementById('leaderboard-list');

        let playerName = "Anonim";
        let score = 0;
        let gameActive = false;
        let currentZone = "tanah"; 
        let didMoveThisRound = false;
        let roofAlpha = 1; 
        let waveOffset = 0; 

        let gameLoopTimer;
        let gamePhase = "idle"; 
        let phaseTimeLeft = 0;
        let maxPhaseTime = 5;
        let particles = [];

        // ==========================================
        // CONFIG & PRELOAD SPRITE ANIMATION CHARACTER
        // ==========================================
        const spriteIdle = new Image();
        spriteIdle.src = '1000018161-removebg-preview.png'; // Sprite Diam tunggal

        const spriteRun = new Image();
        spriteRun.src = '1000018020-removebg-preview.png
            ';  // Spritesheet Lari (4 Kolom x 2 Baris)

        const spriteConfig = {
            cols: 4,
            rows: 2,
            totalFrames: 8,
            getFrameWidth: function() { return spriteRun.width / this.cols; },
            getFrameHeight: function() { return spriteRun.height / this.rows; },
            animSpeed: 0.15, 
            currentFrame: 0
        };

        const player = {
            x: 400, 
            y: 250,
            radius: 14, 
            speed: 5,
            keys: {},
            isMoving: false,
            facingLeft: false
        };

        const zones = {
            danau: { x: 460, y: 50, w: 290, h: 190 },
            kapal: { x: 560, y: 120, w: 85, h: 45 },
            pasir: { x: 50, y: 310, w: 240, h: 150 },
            perosotan: { x: 360, y: 340, w: 110, h: 130 },
            rumah: { x: 70, y: 50, w: 200, h: 150 }
        };

        function createParticles() {
            particles = [];
            for(let i=0; i<30; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 4 + 2,
                    color: `hsla(${Math.random() * 40 + 20}, 85%, 60%, ${Math.random() * 0.4 + 0.3})`,
                    speedX: Math.random() * 1 - 0.5,
                    speedY: Math.random() * 0.7 + 0.3
                });
            }
        }

        const commandsList = [
            { text: "Yang nyentuh pasir kacangi!", check: () => currentZone === "pasir" },
            { text: "Yang nyentuh tanah kacangi!", check: () => currentZone === "tanah" },
            { text: "Yang gak naik kapal kacangi!", check: () => currentZone !== "kapal" },
            { text: "Yang gak masuk rumah kacangi!", check: () => currentZone !== "rumah" },
            { text: "Yang gak jalan kacangi!", check: () => !didMoveThisRound },
            { text: "Yang gerak kacangi!", check: () => didMoveThisRound },
            { text: "Yang gak perosotan kacangi!", check: () => currentZone !== "perosotan" }
        ];
        let activeCommand = null;

        // Keyboard Handlers
        window.addEventListener('keydown', (e) => { if(gameActive) player.keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(gameActive) player.keys[e.key] = false; });

        // D-PAD Touch Handlers
        function setupMobileButton(elementId, keyName) {
            const btn = document.getElementById(elementId);
            
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if(gameActive) player.keys[keyName] = true;
            }, { passive: false });
            
            btn.addEventListener('mousedown', () => {
                if(gameActive) player.keys[keyName] = true;
            });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                player.keys[keyName] = false;
            }, { passive: false });
            
            btn.addEventListener('mouseup', () => { player.keys[keyName] = false; });
            btn.addEventListener('mouseleave', () => { player.keys[keyName] = false; });
        }

        setupMobileButton('pad-up', 'ArrowUp');
        setupMobileButton('pad-down', 'ArrowDown');
        setupMobileButton('pad-left', 'ArrowLeft');
        setupMobileButton('pad-right', 'ArrowRight');

        btnStart.addEventListener('click', () => {
            if(nameInput.value.trim().toUpperCase() === "RESETSCOREALL") {
        localStorage.removeItem('izur_leaderboard');
        alert("Leaderboard berhasil di-reset! Halaman akan dimuat ulang.");
        location.reload(); // Refresh otomatis
        return; // Berhenti di sini, jangan lanjut ke game
            }
            if(nameInput.value.trim() !== "") playerName = nameInput.value.trim();
            overlayModal.classList.add('hidden');
            initGame();
        });

        btnRestart.addEventListener('click', () => {
            gameoverModal.classList.add('hidden');
            initGame();
        });

        function initGame() {
            score = 0;
            currentScoreText.textContent = "000";
            player.x = 380;
            player.y = 260;
            player.keys = {};
            player.isMoving = false;
            player.facingLeft = false;
            gameActive = true;
            didMoveThisRound = false;
            createParticles();
            
            triggerIdlePhase();
            requestAnimationFrame(updateGameEngine);
        }

        function triggerIdlePhase() {
            gamePhase = "idle";
            activeCommand = null;
            izurCommandText.textContent = "IZUR SEDANG BERPIKIR...";
            izurCommandText.style.color = "#a6adc8";
            maxPhaseTime = 5;
            phaseTimeLeft = maxPhaseTime;
            
            clearInterval(gameLoopTimer);
            gameLoopTimer = setInterval(() => {
                phaseTimeLeft--;
                if(phaseTimeLeft <= 0) triggerCommandPhase();
            }, 1000);
        }

        function triggerCommandPhase() {
            gamePhase = "command";
            didMoveThisRound = false; 
            
            activeCommand = commandsList[Math.floor(Math.random() * commandsList.length)];
            izurCommandText.textContent = activeCommand.text;
            izurCommandText.style.color = "#ffdd1a";
            
            maxPhaseTime = 10;
            phaseTimeLeft = maxPhaseTime;

            clearInterval(gameLoopTimer);
            gameLoopTimer = setInterval(() => {
                phaseTimeLeft--;
                if(phaseTimeLeft <= 0) evaluatePlayerSuccess();
            }, 1000);
        }

        function evaluatePlayerSuccess() {
            clearInterval(gameLoopTimer);
            let isKacangi = activeCommand.check();

            if (isKacangi) {
                endGamePlay();
            } else {
                score += 10;
                currentScoreText.textContent = String(score).padStart(3, '0');
                triggerIdlePhase();
            }
        }

        function endGamePlay() {
            gameActive = false;
            izurCommandText.textContent = "GAME OVER! LU DIKACANGI.";
            izurCommandText.style.color = "#f38ba8";
            finalScoreText.textContent = score;
            
            saveLeaderboard(playerName, score);
            showLeaderboard();
            gameoverModal.classList.remove('hidden');
        }

        function checkCurrentZone() {
            let px = player.x; let py = player.y;
            if (px >= zones.rumah.x && px <= zones.rumah.x + zones.rumah.w && py >= zones.rumah.y && py <= zones.rumah.y + zones.rumah.h) return "rumah";
            if (px >= zones.kapal.x && px <= zones.kapal.x + zones.kapal.w && py >= zones.kapal.y && py <= zones.kapal.y + zones.kapal.h) return "kapal";
            if (px >= zones.danau.x && px <= zones.danau.x + zones.danau.w && py >= zones.danau.y && py <= zones.danau.y + zones.danau.h) return "danau"; 
            if (px >= zones.pasir.x && px <= zones.pasir.x + zones.pasir.w && py >= zones.pasir.y && py <= zones.pasir.y + zones.pasir.h) return "pasir";
            if (px >= zones.perosotan.x && px <= zones.perosotan.x + zones.perosotan.w && py >= zones.perosotan.y && py <= zones.perosotan.y + zones.perosotan.h) return "perosotan";
            return "tanah";
        }

        function updateGameEngine() {
            if(!gameActive) return;

            player.isMoving = false;

            if (player.keys['ArrowUp'] || player.keys['w'] || player.keys['W']) { player.y -= player.speed; player.isMoving = true; }
            if (player.keys['ArrowDown'] || player.keys['s'] || player.keys['S']) { player.y += player.speed; player.isMoving = true; }
            if (player.keys['ArrowLeft'] || player.keys['a'] || player.keys['A']) { player.x -= player.speed; player.isMoving = true; player.facingLeft = true; }
            if (player.keys['ArrowRight'] || player.keys['d'] || player.keys['D']) { player.x += player.speed; player.isMoving = true; player.facingLeft = false; }

            if(player.isMoving && gamePhase === "command") {
                didMoveThisRound = true;
            }

            if(player.x < player.radius) player.x = player.radius;
            if(player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if(player.y < player.radius) player.y = player.radius;
            if(player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

            currentZone = checkCurrentZone();

            if(currentZone === "danau") {
                endGamePlay();
                return;
            }

            let percentage = (phaseTimeLeft / maxPhaseTime) * 100;
            timerProgress.style.width = percentage + "%";
            timerProgress.style.backgroundColor = gamePhase === "command" ? "#ffdd1a" : "#a6e3a1";

            if (currentZone === "rumah") {
                if(roofAlpha > 0) roofAlpha -= 0.08;
            } else {
                if(roofAlpha < 1) roofAlpha += 0.08;
            }

            waveOffset += 0.05;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Rumput
            ctx.fillStyle = '#457a22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Pasir
            let sandGrad = ctx.createLinearGradient(zones.pasir.x, zones.pasir.y, zones.pasir.x+zones.pasir.w, zones.pasir.y+zones.pasir.h);
            sandGrad.addColorStop(0, '#e9c46a'); sandGrad.addColorStop(1, '#dfb24c');
            ctx.fillStyle = sandGrad;
            ctx.fillRect(zones.pasir.x, zones.pasir.y, zones.pasir.w, zones.pasir.h);
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.font = 'bold 11px Poppins';
            ctx.fillText("⏳ AREA PASIR", zones.pasir.x + 15, zones.pasir.y + 25);

            // 3. Danau
            let lakeGrad = ctx.createLinearGradient(zones.danau.x, zones.danau.y, zones.danau.x+zones.danau.w, zones.danau.y+zones.danau.h);
            lakeGrad.addColorStop(0, '#0077b6'); lakeGrad.addColorStop(1, '#0096c7');
            ctx.fillStyle = lakeGrad;
            ctx.fillRect(zones.danau.x, zones.danau.y, zones.danau.w, zones.danau.h);

            // 4. Kapal
            ctx.fillStyle = '#5c3d2e';
            ctx.fillRect(zones.kapal.x, zones.kapal.y, zones.kapal.w, zones.kapal.h);
            ctx.fillStyle = '#fff';
            ctx.fillText("⛵ DECK KAPAL", zones.kapal.x + 5, zones.kapal.y + 25);

            // 5. Perosotan
            let slideGrad = ctx.createLinearGradient(zones.perosotan.x, zones.perosotan.y, zones.perosotan.x+zones.perosotan.w, zones.perosotan.y);
            slideGrad.addColorStop(0, '#f26419'); slideGrad.addColorStop(1, '#f6bd60');
            ctx.fillStyle = slideGrad;
            ctx.fillRect(zones.perosotan.x, zones.perosotan.y, zones.perosotan.w, zones.perosotan.h);
            ctx.fillStyle = '#fff';
            ctx.fillText("🛝 PEROSOTAN", zones.perosotan.x + 10, zones.perosotan.y + 25);

            // 6. Lantai Rumah
            ctx.fillStyle = '#e5e5e5';
            ctx.fillRect(zones.rumah.x, zones.rumah.y, zones.rumah.w, zones.rumah.h);
            ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 4;
            ctx.strokeRect(zones.rumah.x, zones.rumah.y, zones.rumah.w, zones.rumah.h);

            // 7. Render Bayangan Kaki Sprite
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); 
            ctx.ellipse(player.x, player.y + 22, 16, 6, 0, 0, Math.PI * 2); 
            ctx.fill();

            // Render Karakter Stickman (Sprite Crop & Auto-Flip)
            ctx.save();
            if (player.facingLeft) {
                ctx.translate(player.x * 2, 0);
                ctx.scale(-1, 1);
            }

            const drawW = 42;
            const drawH = 54;
            const drawX = player.x - (drawW / 2);
            const drawY = player.y - (drawH / 2);

            if (player.isMoving) {
                let frameW = spriteConfig.getFrameWidth();
                let frameHeight = spriteConfig.getFrameHeight();
                let currentIdx = Math.floor(spriteConfig.currentFrame) % spriteConfig.totalFrames;
                let col = currentIdx % spriteConfig.cols;
                let row = Math.floor(currentIdx / spriteConfig.cols);

                ctx.drawImage(
                    spriteRun, 
                    col * frameW, row * frameHeight, frameW, frameHeight,
                    drawX, drawY, drawW, drawH
                );
                spriteConfig.currentFrame += spriteConfig.animSpeed;
            } else {
                ctx.drawImage(spriteIdle, drawX, drawY, drawW, drawH);
                spriteConfig.currentFrame = 0;
            }
            ctx.restore();

            // 8. Atap Rumah Segitiga 3D
            if (roofAlpha > 0.01) {
                let rx = zones.rumah.x; let ry = zones.rumah.y;
                let rw = zones.rumah.w; let rh = zones.rumah.h;
                let cx = rx + (rw / 2); let cy = ry + (rh / 2);

                ctx.fillStyle = `rgba(168, 180, 202, ${roofAlpha})`;
                ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + rw, ry); ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();

                ctx.fillStyle = `rgba(141, 153, 174, ${roofAlpha})`;
                ctx.beginPath(); ctx.moveTo(rx + rw, ry); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();

                ctx.fillStyle = `rgba(102, 112, 133, ${roofAlpha})`;
                ctx.beginPath(); ctx.moveTo(rx + rw, ry + rh); ctx.lineTo(rx, ry + rh); ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();

                ctx.fillStyle = `rgba(120, 131, 151, ${roofAlpha})`;
                ctx.beginPath(); ctx.moveTo(rx, ry + rh); ctx.lineTo(rx, ry); ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();

                ctx.fillStyle = `rgba(255, 255, 255, ${roofAlpha})`;
                ctx.font = 'bold 11px Poppins';
                ctx.shadowColor = "black"; ctx.shadowBlur = 4;
                ctx.fillText("🏡 ECO HOUSE (3D)", rx + 15, ry + rh - 15);
                ctx.shadowBlur = 0;
            }

            // Partikel
            particles.forEach((p) => {
                p.y += p.speedY; p.x += p.speedX;
                if(p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            requestAnimationFrame(updateGameEngine);
        }

        function saveLeaderboard(name, finalScore) {
            let leaderboard = JSON.parse(localStorage.getItem('izur_leaderboard')) || [];
            leaderboard.push({ name: name, score: finalScore });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5);
            localStorage.setItem('izur_leaderboard', JSON.stringify(leaderboard));
        }

        function showLeaderboard() {
            let leaderboard = JSON.parse(localStorage.getItem('izur_leaderboard')) || [];
            leaderboardList.innerHTML = "";
            if(leaderboard.length === 0) {
                leaderboardList.innerHTML = "<p>Belum ada data skor.</p>";
                return;
            }
            leaderboard.forEach((data, idx) => {
                let item = document.createElement('div');
                item.className = "leaderboard-item";
                if(data.name === playerName && data.score === score) {
                    item.style.background = "linear-gradient(to right, #ffdd1a, #ffaa00)";
                    item.style.color = "#000";
                }
                item.innerHTML = `<span><b>#${idx + 1}</b> ${data.name}</span> <span>${data.score} PTS</span>`;
                leaderboardList.appendChild(item);
            });
        }
    </script>
</body>
</html>
